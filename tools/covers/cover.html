<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Squeeze Street cover</title>
<!-- One CrazyGames cover, composed as SVG at its CSS size (render at 2x). Driven by tools/covers/make.js:
       cover.html#fmt=landscape|portrait|square&scene=<file URL of make.js's transparent-sky scene render>
     Same look as the approved key art: game sky, sunburst behind the logo, cream clouds, lemon slices, drops, sparkles. -->
<style>html, body { margin: 0; background: #2487d1; overflow: hidden; } svg { display: block; }</style>
</head>
<body>
<script>
(function () {
  'use strict';
  var INK = '#1b1f3b', LOGO_W = 818, LOGO_H = 856;
  var q = {}; location.hash.slice(1).split('&').forEach(function (p) { var i = p.indexOf('='); if (i > 0) q[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); });

  /* Per format. logo: centre x, top y, width. burst: the sunburst's centre (behind the mascot) and the glow's radius.
     Decorations sit in the sky and the margins, never on a face. */
  var F = {
    landscape: { w: 1920, h: 1080, logo: [455, 46, 800], burst: [450, 410, 620],
      clouds: [[1210, 120, 0.95, 0.95], [1750, 70, 0.7, 0.85]],
      slices: [[110, 170, 0.78, -18], [870, 140, 0.55, 22], [95, 905, 0.62, 30]],
      drops: [[905, 330, 0.62, 18], [62, 560, 0.55, -14], [790, 930, 0.5, 10]],
      sparks: [[300, 90, 0.85], [690, 150, 0.6], [1000, 230, 0.75], [140, 690, 0.55], [880, 560, 0.5]] },
    portrait: { w: 800, h: 1200, logo: [400, 34, 680], burst: [400, 330, 560],
      clouds: [[640, 640, 0.6, 0.9], [150, 610, 0.55, 0.85]],
      slices: [[78, 120, 0.5, -18], [745, 615, 0.42, 24]],
      drops: [[722, 120, 0.45, 18], [70, 520, 0.42, -12]],
      sparks: [[160, 40, 0.6], [690, 300, 0.55], [100, 330, 0.45], [600, 700, 0.4]] },
    square: { w: 800, h: 800, logo: [400, 6, 530], burst: [400, 240, 460],
      clouds: [[700, 330, 0.5, 0.9], [100, 330, 0.5, 0.85]],
      slices: [[86, 86, 0.48, -18], [714, 112, 0.42, 24]],
      drops: [[150, 230, 0.4, -12], [660, 250, 0.38, 16]],
      sparks: [[200, 40, 0.5], [610, 40, 0.45], [700, 210, 0.4]] }
  };
  var f = F[q.fmt] || F.landscape, W = f.w, H = f.h, bx = f.burst[0], by = f.burst[1], R = f.burst[2];

  // the key art's pieces (same shapes and colours as the approved 4K image)
  function cloud(x, y, s, o) {
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')" opacity="' + o + '" fill="#fffdf0"><circle cx="-70" cy="10" r="48"/><circle cx="-10" cy="-22" r="66"/><circle cx="62" cy="0" r="54"/><circle cx="118" cy="22" r="36"/><rect x="-118" y="10" width="272" height="48" rx="24"/></g>';
  }
  function slice(x, y, s, rot) {
    var seg = '', i, a, b, m;
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4 + Math.PI / 8; b = a + Math.PI / 4 - 0.16; m = (a + b) / 2;
      seg += '<path d="M' + (8 * Math.cos(m)).toFixed(1) + ' ' + (8 * Math.sin(m)).toFixed(1) + 'L' + (56 * Math.cos(a + 0.08)).toFixed(1) + ' ' + (56 * Math.sin(a + 0.08)).toFixed(1) +
        'A56 56 0 0 1 ' + (56 * Math.cos(b)).toFixed(1) + ' ' + (56 * Math.sin(b)).toFixed(1) + 'Z" fill="#ffd83d"/>';
    }
    return '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot + ') scale(' + s + ')"><circle cx="0" cy="9" r="80" fill="' + INK + '"/>' +
      '<circle r="80" fill="#f2ae00" stroke="' + INK + '" stroke-width="9"/><circle r="68" fill="#fff4b8"/>' + seg +
      '<path d="M-50 -34A62 62 0 0 1 -12 -60" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none" opacity=".85"/></g>';
  }
  function drop(x, y, s, rot) {
    var d = 'M0 -46C14 -22 30 -4 30 16A30 30 0 0 1 -30 16C-30 -4 -14 -22 0 -46Z';
    return '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot + ') scale(' + s + ')"><path d="' + d + '" fill="' + INK + '" transform="translate(0 6)"/>' +
      '<path d="' + d + '" fill="#ffd83d" stroke="' + INK + '" stroke-width="7" stroke-linejoin="round"/><path d="M-12 4A16 16 0 0 0 -8 22" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/></g>';
  }
  function spark(x, y, s) { return '<path transform="translate(' + x + ' ' + y + ') scale(' + s + ')" d="M0 -30Q4 -4 30 0Q4 4 0 30Q-4 4 -30 0Q-4 -4 0 -30Z" fill="#fff"/>'; }
  function rays(n, len) {
    var out = '', i, a0, a1;
    for (i = 0; i < n; i++) {
      a0 = (i / n) * Math.PI * 2; a1 = a0 + Math.PI / n;
      out += '<path d="M' + bx + ' ' + by + 'L' + (bx + len * Math.cos(a0)).toFixed(1) + ' ' + (by + len * Math.sin(a0)).toFixed(1) + 'L' + (bx + len * Math.cos(a1)).toFixed(1) + ' ' + (by + len * Math.sin(a1)).toFixed(1) + 'Z"/>';
    }
    return out;
  }
  function each(list, fn) { return list.map(function (a) { return fn.apply(null, a); }).join(''); }

  var lw = f.logo[2], lh = lw * LOGO_H / LOGO_W, scene = q.scene ? '<image href="' + q.scene + '" width="' + W + '" height="' + H + '"/>' : '';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
    '<defs>' +
    '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2487d1"/><stop offset=".55" stop-color="#4cc3f0"/><stop offset="1" stop-color="#bfe9fb"/></linearGradient>' +
    '<radialGradient id="rayfade" cx="' + bx + '" cy="' + by + '" r="' + R * 1.6 + '" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="rayfade2" cx="' + bx + '" cy="' + by + '" r="' + R * 0.9 + '" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="glow" cx="' + bx + '" cy="' + by + '" r="' + R + '" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffef6" stop-opacity=".92"/><stop offset=".35" stop-color="#fffaf0" stop-opacity=".62"/><stop offset=".7" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="vig" cx="' + W / 2 + '" cy="' + H * 0.46 + '" r="' + Math.hypot(W, H) * 0.56 + '" gradientUnits="userSpaceOnUse"><stop offset=".62" stop-color="#0b3a6b" stop-opacity="0"/><stop offset="1" stop-color="#0b3a6b" stop-opacity=".32"/></radialGradient>' +
    '</defs>' +
    '<rect width="' + W + '" height="' + H + '" fill="url(#sky)"/>' +
    '<g fill="url(#rayfade)">' + rays(28, Math.hypot(W, H)) + '</g>' +
    each(f.clouds, cloud) +
    scene +
    '<rect width="' + W + '" height="' + H + '" fill="url(#glow)"/>' +
    '<g fill="url(#rayfade2)">' + rays(28, R * 0.9) + '</g>' +
    '<rect width="' + W + '" height="' + H + '" fill="url(#vig)"/>' +
    each(f.slices, slice) + each(f.drops, drop) + each(f.sparks, spark) +
    '<image href="../../brand/logo.svg" x="' + (f.logo[0] - lw / 2) + '" y="' + f.logo[1] + '" width="' + lw + '" height="' + lh.toFixed(1) + '"/>' +
    '</svg>';
  document.body.innerHTML = svg;
  var imgs = [].slice.call(document.querySelectorAll('image')), n = 0;
  window.coverReady = imgs.length ? 'loading' : 'ok';
  imgs.forEach(function (im) {
    var probe = new Image();
    probe.onload = function () { if (++n === imgs.length) window.coverReady = 'ok'; };
    probe.onerror = function () { window.coverReady = 'missing ' + im.getAttribute('href'); };
    probe.src = im.getAttribute('href');
  });
})();
</script>
</body>
</html>

    if (st.phase === 'prep') return 0.03;
    if (st.phase === 'day') return st.today ? SS.clamp(st.today.t, 0, 1) * 0.98 + 0.03 : 0.03;
    return 1.13;
  }
  function updateEnv(dt) {
    var st = SS.state, dbg = SS.debugEnv || null;
    env.phase = st ? st.phase : 'title';
    env.loc = (st && st.location) || 'street';
    env.reduced = SS.reduced();
    var tgt = dayTarget(st), gap = ((tgt - env.dayT) % NIGHT_SPAN + NIGHT_SPAN) % NIGHT_SPAN;
    if (gap > NIGHT_SPAN - 0.05) gap -= NIGHT_SPAN;      // tiny step backwards is fine
    if (env.reduced) env.dayT = tgt;
    else if (st && st.phase === 'day' && Math.abs(gap) < 0.06) env.dayT = tgt;
    else env.dayT += SS.clamp(gap, -0.02, 1) * Math.min(1, dt * 2.2);
    env.dayT = (env.dayT % NIGHT_SPAN + NIGHT_SPAN) % NIGHT_SPAN;

    var wx = st && (st.phase === 'day' && st.today ? st.today.weatherNow : st.phase === 'results' ? st.weather : st.phase === 'prep' ? st.forecast : null);
    var type = (wx && wx.type) || 'sunny', temp = (wx && wx.temp) || 26;
    var w = env.weather, k = env.reduced ? 1000 : 0.9;
    w.type = type; w.temp = temp;
    w.wet = SS.damp(w.wet, type === 'rainy' ? 0.7 : type === 'storm' ? 1 : 0, k, dt);
    w.storm = SS.damp(w.storm, type === 'storm' ? 1 : 0, k, dt);
    w.heat = SS.damp(w.heat, type === 'heatwave' ? 1 : SS.remap(temp, 28, 36, 0, 0.6), k, dt);
    w.cloud = SS.damp(w.cloud, type === 'cloudy' ? 0.75 : type === 'rainy' ? 0.9 : type === 'storm' ? 1 : type === 'heatwave' ? 0.05 : 0.22, k, dt);
    env.wind = SS.damp(env.wind, type === 'storm' ? 0.9 : type === 'rainy' ? 0.45 : 0.15 + 0.1 * Math.sin(env.t * 0.13), 0.8, dt);
    if (dbg) {                                           // debug.js overrides for screenshots
      if (dbg.dayT != null) env.dayT = dbg.dayT;
      if (dbg.loc) env.loc = dbg.loc;
      if (dbg.weather) Object.assign(env.weather, dbg.weather);
      if (dbg.wind != null) env.wind = dbg.wind;
    }
  }

  var Render = (SS.Render = {
    init: function () {
      scene = document.getElementById('scene'); fx = document.getElementById('fx');
      sctx = scene.getContext('2d'); fctx = fx.getContext('2d');
      resize();
      window.addEventListener('resize', resize);
      if (window.ResizeObserver) new ResizeObserver(resize).observe(scene);
      document.getElementById('game').classList.toggle('reduced', SS.reduced());
      SS.on('settings', function () { document.getElementById('game').classList.toggle('reduced', SS.reduced()); });
    },
    resize: resize,
    /** dt = real seconds since last frame (0 while paused) */
    frame: function (dt) {
      if (!sctx) return;
      if (SS.debugEnv && SS.debugEnv.t != null) { env.t = SS.debugEnv.t; dt = SS.debugEnv.dt || 0; }
      else env.t += dt;
      env.dt = dt;
      updateEnv(dt);
      updateView(dt);
      var mods = [SS.Sky, SS.Backdrops, SS.Actors, SS.FX], names = ['Sky', 'Backdrops', 'Actors', 'FX'];
      mods.forEach(function (m, i) { if (m && m.update) safe(names[i] + '.update', function () { m.update(dt, view, env); }); });

      var dpr = view.dpr, sh = (SS.FX && SS.FX.shakeOffset && !env.reduced) ? SS.FX.shakeOffset() : null;
      sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sctx.clearRect(0, 0, view.w, view.h);
      if (!SS.Sky) {                                      // plain fallback so the page is never black
        var g = sctx.createLinearGradient(0, 0, 0, view.h);
        g.addColorStop(0, '#58b9f5'); g.addColorStop(0.7, '#bfe9ff'); g.addColorStop(0.7, '#cfd6c4'); g.addColorStop(1, '#8f9a86');
        sctx.fillStyle = g; sctx.fillRect(0, 0, view.w, view.h);
      }
      if (sh) sctx.setTransform(dpr, 0, 0, dpr, sh.x * dpr, sh.y * dpr);
      var layers = [
        ['Sky.draw', SS.Sky, 'draw'], ['Backdrops.drawBack', SS.Backdrops, 'drawBack'], ['Actors.draw', SS.Actors, 'draw'],
        ['Backdrops.drawFront', SS.Backdrops, 'drawFront'], ['Sky.drawWeather', SS.Sky, 'drawWeather']
      ];
      layers.forEach(function (l) {
        if (!l[1] || !l[1][l[2]]) return;
        sctx.save();
        safe(l[0], function () { l[1][l[2]](sctx, view, env); });
        sctx.restore();
      });
      fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fctx.clearRect(0, 0, view.w, view.h);
      if (SS.FX && SS.FX.draw) { fctx.save(); safe('FX.draw', function () { SS.FX.draw(fctx, view, env); }); fctx.restore(); }
    }
  });
})();

</script>
<script>
/* Squeeze Street — ui.js
 * The interface shell (DOM only): HUD, title screen, day bar, pause card, modals, toasts,
 * banners, coach tips, settings, how to play and the win screen.
 * Builds SS.UI exactly as the contract in core.js describes. Styles live in css/ui.css.
 */
(function () {
  'use strict';
  var SS = window.SS;
  if (!SS || !SS.h || !SS.DATA) return;
  var h = SS.h, D = SS.DATA, clamp = SS.clamp, ITEMS = D.itemOrder;
  var LOC_ICON = { street: 'locStreet', park: 'locPark', beach: 'locBeach', downtown: 'locDowntown', carnival: 'locCarnival' };
  var WX_NOTE = {
    sunny: 'Clear skies again.', heatwave: 'Thirsty crowds, and they want ice.', cloudy: 'Fewer people feel thirsty.',
    rainy: 'The street is emptying out.', storm: 'Hardly anyone is about.'
  };
  var BUMP = [{ transform: 'scale(1)' }, { transform: 'scale(1.28)', offset: 0.4 }, { transform: 'scale(1)' }];
  var SHAKE = [{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }];

  var R = {};                                   // root elements
  var hud = {}, bar = {}, ttl = {}, pause = {}; // element refs per area
  var dv = {};                                  // last values written to the day bar
  var phase = 'title', inited = false, warned = {};

  /* ------------------------------------------------------------------ *
   * Small helpers
   * ------------------------------------------------------------------ */
  function $(id) { return document.getElementById(id); }
  function ico(name, cls) { return SS.iconEl(name, cls); }
  function warn(tag, e) { if (!warned[tag]) { warned[tag] = 1; console.error('[SS.UI] ' + tag, e); } }
  /** guarded SS.Sim call: sim('setPrice', 1.5) */
  function sim(name) {
    var S = SS.Sim;
    if (!S || typeof S[name] !== 'function') return undefined;
    try { return S[name].apply(S, Array.prototype.slice.call(arguments, 1)); } catch (e) { warn('Sim.' + name, e); return undefined; }
  }
  /** a real <button> that clicks audibly */
  function btn(cls, kids, fn, attrs) {
    var p = { class: cls, type: 'button' }, k;
    if (attrs) for (k in attrs) p[k] = attrs[k];
    var b = h('button', p, kids);
    b.addEventListener('click', function (e) { SS.sfx('click'); if (fn) fn(e, b); });
    return b;
  }
  function put(el, v) { if (el && el._v !== v) { el._v = v; el.textContent = v; return true; } return false; }
  function setIcon(holder, name) { if (holder && holder._n !== name) { holder._n = name; holder.innerHTML = SS.icon(name); } }
  /** one-shot flourish; skipped entirely when motion is reduced */
  function anim(el, frames, ms, easing) {
    if (!el || !el.animate || SS.reduced()) return;
    try { el.animate(frames, { duration: ms, easing: easing || 'ease-out' }); } catch (e) { /* cosmetic only */ }
  }
  function stars1(v) { return (Math.round((Number(v) || 0) * 10) / 10).toFixed(1); }
  function itemName(id) { var it = D.items[id]; return it ? it.name.toLowerCase() : 'supplies'; }
  function refuse(el, text, icon) { SS.sfx('error'); anim(el, SHAKE, 300); if (text) toast(text, 'info', icon || 'info'); }
  function soundOn() { var s = SS.state && SS.state.settings; return !!s && !!(s.sfx || s.music); }
  function toggleSound() { var on = !soundOn(); sim('setSetting', 'sfx', on); sim('setSetting', 'music', on); }
  function openScreen(name) {
    if (SS.Screens && SS.Screens.open) { try { SS.Screens.open(name); } catch (e) { warn('Screens.open', e); } }
    else refuse(null, 'That screen is still being set up.');
  }

  /* ------------------------------------------------------------------ *
   * HUD
   * ------------------------------------------------------------------ */
  var pendDelta = 0, deltaTimer = 0;

  function buildHud() {
    hud.dayNum = h('b', { class: 'hud-day-num display num' }, '1');
    hud.day = h('div', { class: 'hud-bar hud-day' }, h('span', { class: 'label' }, 'Day'), hud.dayNum);

    hud.locIco = h('span', { class: 'hud-ico' });
    hud.locName = h('span', { class: 'hud-loc-name' });
    hud.loc = btn('hud-seg hud-loc', [hud.locIco, hud.locName], onLoc);
    hud.wxIco = h('span', { class: 'hud-ico' });
    hud.wxTemp = h('b', { class: 'num' });
    hud.wxName = h('span', { class: 'hud-sr' });
    hud.wxTag = h('span', { class: 'hud-wx-tag label' }, 'Forecast');
    hud.wx = h('div', { class: 'hud-seg hud-wx' }, hud.wxIco, hud.wxTemp, hud.wxName, hud.wxTag);
    hud.clockText = h('b', { class: 'hud-clock-text num' }, SS.clockText(0));
    hud.track = h('div', { class: 'hud-clock-track', 'aria-hidden': 'true' }, h('i', { class: 'hud-clock-fill' }), h('i', { class: 'hud-clock-sun' }));
    hud.clock = h('div', { class: 'hud-bar hud-clock', hidden: true }, h('span', { class: 'hud-sr' }, 'Time '), hud.clockText, hud.track);
    hud.subBoosts = h('span', { class: 'hud-sub-boosts', 'aria-hidden': 'true' });       // today's boosts, on narrow phones only
    hud.sub = h('div', { class: 'hud-sub' }, h('div', { class: 'hud-bar hud-ctx' }, hud.loc, hud.wx), hud.clock, hud.subBoosts);

    hud.repStars = h('span', { class: 'hud-rep-full', html: SS.starsHTML(0) });
    hud.repOn = hud.repStars.querySelector('.stars-on');
    hud.repNum = h('b', { class: 'num' }, '0.0');
    hud.rep = h('div', { class: 'hud-seg hud-rep', id: 'hud-rep', role: 'img', title: 'Your reputation' },
      hud.repStars, h('span', { class: 'hud-rep-one', html: SS.icon('star') }), hud.repNum);
    hud.cash = h('span', { class: 'hud-cash-num display num', id: 'hud-cash' }, SS.fmtMoney(0));
    hud.cashSeg = h('div', { class: 'hud-seg hud-cash', title: 'Cash' }, ico('coin'), h('span', { class: 'hud-sr' }, 'Cash '), hud.cash);
    hud.stats = h('div', { class: 'hud-bar hud-stats' }, hud.rep, hud.cashSeg);

    // Dex's deals during the day: his face, today's boosts as a little stack, a dot while a limited edition is in
    hud.dealsStack = h('span', { class: 'hud-deals-stack', 'aria-hidden': 'true' });
    hud.deals = btn('hud-bar hud-deals', [h('span', { class: 'hud-deals-face' }, ico('dealer')), hud.dealsStack, h('i', { class: 'hud-deals-dot', 'aria-hidden': 'true' })],
      function () { openScreen('dealer'); }, { hidden: true });

    hud.snd = btn('btn btn--icon', null, toggleSound);
    hud.btns = h('div', { class: 'hud-btns' },
      btn('btn btn--icon', ico('trophy'), function () { openScreen('goals'); }, { 'aria-label': 'Goals', title: 'Goals' }),
      hud.snd,
      btn('btn btn--icon', ico('gear'), openSettings, { 'aria-label': 'Settings', title: 'Settings' }));
    hud.menuBtn = btn('btn btn--icon hud-menu-btn', ico('menu'), function () { toggleMenu(); },
      { 'aria-label': 'Menu', 'aria-haspopup': 'true', 'aria-expanded': 'false' });
    hud.menu = h('div', { class: 'hud-menu panel', role: 'menu', hidden: true });
    R.hud.replaceChildren(hud.day, hud.sub, hud.deals, hud.stats, hud.btns, hud.menuBtn, hud.menu);
  }

  /** Show the deals button while Dex is open for business during the day. Cheap: runs on events, not per frame. */
  function refreshDeals() {
    if (!hud.deals) return;
    var s = SS.state, info = s && s.phase === 'day' ? sim('dealerInfo') : null;
    var show = !!(info && info.present && Array.isArray(info.offers));
    hud.deals.hidden = !show;
    R.hud.classList.toggle('has-deals', show);
    if (!show) { if (hud.dealsKey) { hud.dealsKey = null; hud.dealsStack.replaceChildren(); hud.subBoosts.replaceChildren(); } return; }
    var act = (info.active || []).filter(function (id) { return D.boosts && D.byId(D.boosts, id); }), key = act.join(',');
    var lim = info.offers.some(function (o) { return o.kind === 'limited' && !o.sold; });
    if (hud.dealsKey !== key) {
      var grew = hud.dealsKey != null && key.length > hud.dealsKey.length;
      hud.dealsKey = key;
      var dots = act.slice(0, 3).map(function (id, i) {
        var b = D.byId(D.boosts, id);
        return h('span', { class: 'hud-deals-boost' + (grew && i === Math.min(act.length, 3) - 1 ? ' is-new' : ''), style: '--bc:' + b.color }, ico(b.icon));
      });
      if (act.length > 3) dots.push(h('span', { class: 'hud-deals-more num' }, '+' + (act.length - 3)));
      hud.dealsStack.replaceChildren.apply(hud.dealsStack, dots);
      hud.subBoosts.replaceChildren.apply(hud.subBoosts, dots.map(function (d) { return d.cloneNode(true); }));
    }
    hud.deals.classList.toggle('has-boosts', act.length > 0);
    hud.deals.classList.toggle('has-limited', lim);
    var names = act.map(function (id) { return D.byId(D.boosts, id).name; });
    var label = 'Dex\'s deals' + (names.length ? '. Active today: ' + names.join(', ') : '') + (lim ? '. A limited edition is in today' : '');
    hud.deals.setAttribute('aria-label', label);
    hud.deals.title = label;
  }

  function onLoc() {
    if (phase === 'day') refuse(hud.loc, 'You can move the stand before you open or after you close.', 'map');
    else openScreen('map');
  }

  function menuItem(icon, label, fn) {
    return btn('hud-menu-item', [ico(icon), label], function () { toggleMenu(false); fn(); }, { role: 'menuitem' });
  }
  function toggleMenu(force) {
    if (!hud.menu) return;
    var open = typeof force === 'boolean' ? force : hud.menu.hidden;
    if (open === !hud.menu.hidden) return;
    if (open) {
      var items = [menuItem('trophy', 'Goals', function () { openScreen('goals'); })];
      if (phase === 'day') items.push(menuItem('pause', 'Pause', function () { SS.setPaused(true); }));
      else items.push(menuItem('map', 'Map', function () { openScreen('map'); }));
      items.push(menuItem(soundOn() ? 'sound' : 'mute', soundOn() ? 'Sound is on' : 'Sound is off', toggleSound));
      items.push(menuItem('gear', 'Settings', openSettings));
      hud.menu.replaceChildren.apply(hud.menu, items);
    }
    hud.menu.hidden = !open;
    hud.menuBtn.setAttribute('aria-expanded', String(open));
    R.hud.classList.toggle('is-menu-open', open);
    if (open && hud.menu.firstChild) hud.menu.firstChild.focus();
  }

  function refreshSound() {
    var on = soundOn(), label = on ? 'Turn sound off' : 'Turn sound on';
    [hud.snd, ttl.snd].forEach(function (b) {
      if (!b) return;
      setIcon(b, on ? 'sound' : 'mute');
      b.setAttribute('aria-label', label); b.title = label + ' (M)';
      b.setAttribute('aria-pressed', String(on));
    });
  }

  function refreshWeather() {
    var s = SS.state;
    if (!s || !hud.wx) return;
    var fc = s.phase === 'prep';
    var wx = (s.phase === 'day' && s.today && s.today.weatherNow) || (fc ? s.forecast : s.weather) || s.forecast;
    if (!wx) return;
    var def = D.weather[wx.type] || D.weather.sunny, temp = SS.fmtTemp(wx.temp);
    setIcon(hud.wxIco, def.icon);
    put(hud.wxTemp, temp);
    put(hud.wxName, ' ' + def.name + (fc ? ' forecast' : ''));
    hud.wxTag.hidden = !fc;
    hud.wx.title = (fc ? 'Forecast: ' : '') + def.name + ', ' + temp;
  }

  function setRep(v) {
    v = clamp(Number(v) || 0, 0, 5);
    put(hud.repNum, stars1(v));
    if (hud.repOn) hud.repOn.style.width = (v / 5 * 100).toFixed(1) + '%';
    hud.rep.setAttribute('aria-label', 'Reputation: ' + stars1(v) + ' out of 5 stars');
  }
  function setCash(amount, tick) {
    amount = Number(amount) || 0;
    hud.cashSeg.classList.toggle('is-long', SS.fmtMoney(amount).length > 9);
    SS.countTo(hud.cash, amount, { ms: tick ? 500 : 0 });
  }

  function refreshHud() {
    var s = SS.state;
    if (!s || !hud.day) return;
    var inDay = s.phase === 'day', loc = D.byId(D.locations, s.location) || D.locations[0];
    put(hud.dayNum, String(s.day || 1));
    setIcon(hud.locIco, LOC_ICON[loc.id] || 'map');
    put(hud.locName, loc.name);
    hud.loc.title = inDay ? loc.name : 'Open the map';
    hud.loc.setAttribute('aria-label', inDay ? 'Your stand is at ' + loc.name : loc.name + '. Open the map');
    hud.loc.classList.toggle('is-fixed', inDay);
    hud.clock.hidden = !inDay;
    R.hud.classList.toggle('is-day', inDay);
    refreshWeather();
    setRep(s.reputation);
    setCash(s.cash, false);
    refreshSound();
  }

  function flushDelta() {
    deltaTimer = 0;
    var d = Math.round(pendDelta * 100) / 100;
    pendDelta = 0;
    if (!d || !hud.stats || R.hud.hidden) return;
    var old = hud.stats.querySelectorAll('.hud-delta');
    if (old.length > 1) old[0].remove();
    var el = h('span', { class: 'hud-delta chip num ' + (d > 0 ? 'chip--good' : 'chip--bad'), 'aria-hidden': 'true' }, (d > 0 ? '+' : '') + SS.fmtMoney(d));
    hud.stats.append(el);
    setTimeout(function () { el.remove(); }, 1250);
  }
  function onCash(p) {
    var s = SS.state;
    if (!s || !hud.cash) return;
    var delta = (p && Number(p.delta)) || 0;
    setCash(p && typeof p.amount === 'number' ? p.amount : s.cash, true);
    if (!delta) return;
    anim(hud.cashSeg, [{ backgroundColor: delta > 0 ? '#a6efc4' : '#ffbcb6' }, { backgroundColor: 'rgba(255,255,255,0)' }], 600);
    pendDelta += delta;
    if (!deltaTimer) deltaTimer = setTimeout(flushDelta, 170);   // a burst of sales shows as one number
  }
  function onRep(p) {
    var s = SS.state;
    if (!s || !hud.rep) return;
    setRep(p && typeof p.value === 'number' ? p.value : s.reputation);
    if (p && p.delta) anim(hud.repNum, BUMP, 300);
  }

  /* ------------------------------------------------------------------ *
   * Day bar
   * ------------------------------------------------------------------ */
  function stat(icon, label, cls) {
    var num = h('b', { class: 'num' }, '0');
    return { num: num, n: -1, lvl: -1, el: h('div', { class: 'daybar-stat' + (cls ? ' ' + cls : ''), title: label }, ico(icon), num, h('span', { class: 'hud-sr' }, ' ' + label)) };
  }
  function buildDaybar() {
    var P = D.price;
    bar.bellCd = h('span', { class: 'daybar-bell-cd num', 'aria-hidden': 'true' });
    bar.bell = btn('daybar-bell', [h('span', { class: 'daybar-bell-face' }, ico('bell')), bar.bellCd], onBell,
      { 'data-tut': 'bell', 'aria-label': 'Ring the bell', title: 'Ring the bell to call people over (B)' });
    bar.price = SS.stepper({ value: P.start, min: P.min, max: P.max, step: P.step, fmt: SS.fmtMoney, label: 'price', onChange: function (v) { sim('setPrice', v); } });
    bar.speedBtns = [1, 2, 3].map(function (n) {
      return btn('daybar-speed-btn', n + '×', function () { onSpeed(n); },
        { 'aria-pressed': 'false', 'aria-label': 'Speed ' + n + ' times', title: 'Speed ' + n + '× (press ' + n + ')' });
    });
    bar.speed = h('div', { class: 'daybar-speed', 'data-tut': 'speed', role: 'group', 'aria-label': 'Game speed' }, bar.speedBtns);
    var pauseBtn = btn('btn btn--icon daybar-pause', ico('pause'), function () { SS.setPaused(true); }, { 'aria-label': 'Pause', title: 'Pause (Space)' });
    var ctl = h('div', { class: 'daybar-ctl' }, bar.bell,
      h('div', { class: 'daybar-price' }, h('span', { class: 'label' }, 'Price'), bar.price), bar.speed, pauseBtn);

    bar.pitNum = h('b', { class: 'num' }, '0/0');
    bar.pitMeter = h('div', { class: 'meter daybar-pit-meter' }, h('i'));
    bar.pit = h('div', { class: 'daybar-pit', title: 'Cups left in the pitcher' }, ico('pitcher'),
      h('div', { class: 'daybar-pit-col' }, bar.pitNum, bar.pitMeter), h('span', { class: 'hud-sr' }, ' cups in the pitcher'));
    bar.stock = ITEMS.map(function (it) { return stat(D.items[it].icon, D.items[it].name + ' left'); });
    bar.line = stat('people', 'in line');
    bar.sold = stat('drink', 'cups sold today', 'daybar-sold');
    bar.take = stat('cash', 'taken today', 'daybar-take');
    bar.take.num.textContent = SS.fmtMoney(0);
    var stats = h('div', { class: 'daybar-stats', role: 'group', 'aria-label': 'Today so far' },
      bar.pit, h('i', { class: 'daybar-sep' }), bar.stock.map(function (c) { return c.el; }),
      h('i', { class: 'daybar-sep' }), bar.line.el, bar.sold.el, bar.take.el);

    bar.floatIco = h('span', { class: 'hud-ico' });
    bar.floatText = h('span', { class: 'daybar-float-text' });
    bar.floatMeter = h('div', { class: 'meter daybar-float-meter' }, h('i'));
    bar.closeBtn = btn('btn btn--sm btn--primary', 'Close up early', onCloseEarly);
    bar.float = h('div', { class: 'daybar-float', role: 'status', hidden: true }, bar.floatIco, bar.floatMeter, bar.floatText, bar.closeBtn);
    bar.panel = h('div', { class: 'daybar-panel panel' }, bar.float, ctl, stats);
    R.daybar.replaceChildren(bar.panel);
  }

  function onBell() {
    if (sim('ringBell') === true) anim(bar.bell, BUMP, 280);
    else refuse(bar.bell);
  }

  /* Regulars and Dex the Dealer */

  }

  }
  function onDeal(p) {

  var dexBannerDay = 0;
  /** once a morning: tell the player Dex has something they cannot buy anywhere else */
  function dexMorning() {

  /* ------------------------------------------------------------------ *
   * Coach tips for a first-time player
   * ------------------------------------------------------------------ */
  var TIPS = {
    prep: [
      { at: 'market', text: 'Start with the shopping. Buy lemons, sugar, ice and cups for today. Two packs of each is plenty for a first morning.' },
      { at: 'recipe', text: 'This is your recipe. More lemons and sugar make a tastier cup that costs more to pour. Add extra ice when it is hot.' },
      { at: 'price', text: 'Now name your price. Too high and people walk on by. Too low and you sell out with little to show for it.' },
      { at: 'open', text: 'All set? Open the stand and watch the street come to life.' }
    ],
    day: [
      { at: 'bell', text: 'Ring the bell to call passers-by over. It takes a little while to recharge, so save it for a quiet moment.' },
      { at: 'stand', text: 'When the pitcher runs dry, a new batch gets mixed. Tap the stand to squeeze faster, and tap coins on the ground to pick up tips.' }
    ],
    results: [
      { at: 'next', text: 'Read the reviews first: they tell you what to fix tomorrow. Then head into the next day.' }
    ]
  };
  var DEX_TIP = [
    { at: 'deals', once: 'dex', text: 'This is Dex. He sells boosts that last one day, and sometimes a limited-edition flavor you can\'t get anywhere else.' }
  ];
  var coach = { phase: '', steps: null, i: 0, tries: 0, timer: 0, el: null, ring: null, node: null, bw: 0, bh: 0, side: '', x: 0, y: 0, ax: 0, ay: 0, l: 0, t: 0, w: 0, h: 0 };

  function tutDrop() {
    if (coach.el) coach.el.remove();
    if (coach.ring) coach.ring.remove();
    coach.el = coach.ring = coach.node = null;
  }
  function tutClear() {
    clearTimeout(coach.timer);
    tutDrop();
    coach.steps = null; coach.phase = '';
  }
  /** a one-time tip (step.once names its flag in state.tutorial) is remembered once seen or skipped */
  function tutMarkOnce() {
    var s = SS.state, step = coach.steps && coach.steps[coach.i];
    if (step && step.once && s && s.tutorial && !s.tutorial[step.once]) { s.tutorial[step.once] = true; sim('save'); }
  }
  function tutFinish() {
    var s = SS.state;
    tutMarkOnce();
    if (s && s.tutorial && !s.tutorial.done) { s.tutorial.done = true; sim('save'); }
    tutClear();
  }
  function dexHere() { var i = sim('dealerInfo'); return !!(i && i.present); }
  function tutStart(ph) {
    var s = SS.state, t = s && s.tutorial;

    if (!t || t.done || !TIPS[ph]) {
      if (ph === 'prep' && t && !t.dex && dexHere()) tutBegin(ph, DEX_TIP, 1100);   // the first morning Dex turns up
      else tutClear();

    }
    tutBegin(ph, TIPS[ph], ph === 'day' ? 1300 : 700);
  }
  function tutBegin(ph, steps, ms) {

    coach.timer = setTimeout(tutStep, ms);
  }
  function tutAnchor(name) {

    var el = document.querySelector('[data-tut="' + name + '"]');
    return el && el.getClientRects().length ? el : null;
  }
  function tutNext() { tutMarkOnce(); coach.i++; coach.tries = 0; tutStep(); }
  function tutStep() {
    clearTimeout(coach.timer);

      if (coach.phase === 'results') tutFinish(); else coach.steps = [];
      return;
    }
    var node = tutAnchor(step.at);
    if (!node) {                                             // anchors can show up late: look again, then move on
      if (++coach.tries > 18) { coach.tries = 0; coach.i++; }
      coach.timer = setTimeout(tutStep, 150);
      return;
    }
    coach.tries = 0;

      var sc = node.closest('.sheet-body, .modal-body');
      if (sc) {

  /** Keep the bubble glued to its anchor (sheets scroll, the camera eases). Writes only on change. */
  function trackCoach() {
    var hide = layers.length > 0 || (pause.el && !pause.el.hidden);
    if (R.coach.hidden !== hide) R.coach.hidden = hide;
    if (hide || !coach.el) return;

    if (node === 'stand') {
      var v = SS.view, G = SS.W;
      if (!v || phase !== 'day') { tutNext(); return; }
      w = G.STAND_W * v.scale * 1.15; ht = 150 * v.scale;
      l = v.toX(G.STAND_X) - w / 2; t = v.laneY(G.STAND_LANE) - ht;
    } else {
      if (!node.isConnected || !node.getClientRects().length) { tutStep(); return; }
      var r = node.getBoundingClientRect(), o = R.coach.getBoundingClientRect(), f = node.closest('.prep-foot, .res-foot');
      l = r.left - o.left; t = r.top - o.top; w = r.width; ht = r.height;
      if (f) { f = f.getBoundingClientRect(); bar = { l: f.left - o.left, t: f.top - o.top, w: f.width, h: f.height }; }

    var bw = coach.bw, bh = coach.bh, gap = 18, m = 8, top0 = R.hud.hidden ? m : W <= 520 ? 76 : 66;
    var side, x, y, cy = t + Math.min(ht / 2, 70);
    // an anchor in a bottom action bar: keep the whole bar clear (its other buttons and the reason line)
    var k = bar || { l: l, t: t, w: w, h: ht };
    if (k.w < W * 0.6 && k.l > W * 0.4 && k.l - gap - m >= bw) side = 'left';
    else if (k.t - top0 - gap >= bh) side = 'top';
    else if (H - (k.t + k.h) - gap - m >= bh) side = 'bottom';
    else if (k.l - gap - m >= bw) side = 'left';
    else if (W - (k.l + k.w) - gap - m >= bw) side = 'right';

    }

      coach.l = l; coach.t = t; coach.w = w; coach.h = ht;
      coach.ring.style.cssText = 'left:' + (l - 6) + 'px;top:' + (t - 6) + 'px;width:' + (w + 12) + 'px;height:' + (ht + 12) + 'px';

  }
  function tutOn(at) { return !!coach.el && !!coach.steps && !!coach.steps[coach.i] && coach.steps[coach.i].at === at; }

  /* ------------------------------------------------------------------ *
   * Title screen
   * ------------------------------------------------------------------ */
  function buildTitle() {
    var words = ['Squeeze', 'Street'];

        return h('span', { class: 'title-word title-word--' + wi }, w.split('').map(function (ch) {

      h('div', { class: 'title-corner' }, ttl.snd, btn('btn btn--icon', ico('gear'), openSettings, { 'aria-label': 'Settings', title: 'Settings' })),
      h('h1', { class: 'title-logo display', 'aria-label': 'Squeeze Street' },
        h('span', { class: 'title-stack', 'aria-hidden': 'true' }, layer('shadow'), layer('ink'), layer('fill'))),
      h('p', { class: 'title-tag' }, 'Run the sunniest lemonade stand in town.'),
      ttl.actions);
  }
  function refreshTitle() {
    if (!ttl.actions) return;
    var has = sim('hasSave') === true, sum = has ? sim('saveSummary') : null, kids = [];
    if (has) {
      kids.push(btn('btn btn--go btn--lg title-continue', [
        h('span', null, 'Continue'),
        sum ? h('small', { class: 'title-save num' }, 'Day ' + sum.day + ' · ' + SS.fmtMoney(sum.cash) + ' · ' + stars1(sum.reputation) + ' stars') : null

      text: 'Your saved stand' + (sum ? ' (day ' + sum.day + ', ' + SS.fmtMoney(sum.cash) + ')' : '') + ' will be replaced. This cannot be undone.',
      yes: 'Start over', no: 'Keep my stand'

  }
  function showTitle(on) {

    if (el.hidden) return;
    if (SS.reduced()) { el.hidden = true; return; }

  }

  /* ------------------------------------------------------------------ *

  function onPhase(p) {
    var s = SS.state, to = (p && p.to) || (s && s.phase) || 'title';

    pausedByModal = false;

    SS.on('event:trigger', onEvent);
    SS.on('soldout', onSoldOut);
    SS.on('location:unlock', onUnlock);
    SS.on('upgrade:buy', onUpgrade);
    SS.on('milestone', onMilestone);
    SS.on('regular:new', onRegNew);
    SS.on('regular:lost', onRegLost);
    SS.on('regular:streak', onRegStreak);
    SS.on('dealer:buy', function (p) { onDeal(p); refreshDeals(); });
    SS.on('boost:on', refreshDeals);
    SS.on('day:start', refreshDeals);
    SS.on('ui:open', function (p) { if (p && p.name === 'dealer' && tutOn('deals')) tutNext(); });
    SS.on('win', function () { setTimeout(openWin, 1100); });
    SS.on('brew:start', function (p) {

})();

<script>
/* Squeeze Street — screens.js

 *

(function () {

  /* ------------------------------------------------------------------ *

  function listJoin(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function tinted(icon, color, c) { return h('span', { class: c, style: 'color:' + color, html: SS.icon(icon) }); }
  /** today's Dex the Dealer info, or null when the sim cannot say */
  function dex() { var S = sim(); var d = S && S.dealerInfo ? safe('dealerInfo', S.dealerInfo) : null; return d && Array.isArray(d.offers) ? d : null; }
  function boostDef(id) { return (D.boosts && D.byId(D.boosts, id)) || null; }
  function kindName(k) { return D.kinds[k] ? D.kinds[k].name : 'Customer'; }

  var WX_NOTE = {

  var SAID = {

  /* ------------------------------------------------------------------ *

  /* ------------------------------------------------------------------ *

  function mixHex(hex, to, t) {

      var r = S && S.buyDeal ? safe('buyDeal', function () { return S.buyDeal(o.id); }) : null;
      if (r && r.ok) { why.hidden = true; stamp(card, lim ? 'Yours!' : 'Bought!'); }
      else { refuse(card, why, (r && r.reason) || card._reason); restart(why, 'is-alert'); }
      onBuy();
    }
    function refresh(info) {
      var st = SS.state, on = !lim && (info.sold || (st && st.boosts && st.boosts.indexOf(info.id) >= 0));
      var finished = info.sold || on;
      btn.hidden = finished; done.hidden = !finished;
      txt(doneT, lim ? 'Yours to keep' : on ? 'Active today' : 'Sold');
      txt(cost, 'Buy for ' + moneyShort(info.cost));
      btn.setAttribute('aria-label', 'Buy ' + info.name + ' for ' + money(info.cost));
      btn.setAttribute('aria-disabled', info.canBuy ? 'false' : 'true');
      card._reason = info.reason;
      if (finished || info.canBuy) { why.hidden = true; why.classList.remove('is-alert'); }
      else { txt(why, info.reason || 'Dex cannot sell you this right now.'); why.hidden = false; }
      cls(card, 'is-on', finished);
    }
    return { el: card, refresh: refresh };
  }

  function buildDealer() {
    var strip = cashStrip(), cards = {}, order = null;
    var line = h('p', { class: 'dex-line' });
    var hero = h('div', { class: 'dex-hero' },
      h('div', { class: 'dex-avatar', 'aria-hidden': 'true' }, h('i', { class: 'dex-rays' }), I('dealer', 'dex-face')),
      h('div', { class: 'dex-bubble' }, h('span', { class: 'label' }, 'Dex says'), line));
    var activeRow = h('div', { class: 'dex-active-row', role: 'list' });
    var active = h('section', { class: 'dex-active', 'aria-label': 'Boosts active today' }, h('span', { class: 'label' }, 'Active today'), activeRow);
    var grid = h('div', { class: 'dex-grid' });
    var note = h('p', { class: 'dex-note' }, I('info'), h('span'));
    var emptyT = h('strong', { class: 'display dex-empty-title' }), emptyP = h('p');
    var empty = h('div', { class: 'well dex-empty' }, I('dealer', 'dex-empty-face'), emptyT, emptyP);
    var activeKey = null;
    function refresh() {
      var st = SS.state, d = dex();
      if (!st) return;
      strip.refresh();
      var here = !!(d && d.present);
      hero.hidden = active.hidden = grid.hidden = note.hidden = !here;
      empty.hidden = here;
      if (!here) {
        var res = st.phase === 'results', first = (st.day | 0) < 2 && !res;
        txt(emptyT, res ? 'Dex has packed up for the night' : first ? 'Dex rolls into town tomorrow' : 'Dex is not around right now');
        txt(emptyP, res ? 'He\'ll be back in the morning.' : first ? 'He sells boosts that last one day, and sometimes a limited-edition flavor you can\'t get anywhere else.'
          : 'Check back in the morning.');
        return;
      }
      txt(line, '“' + (d.line || 'Step right up! Fresh deals, today only.') + '”');
      txt(note.lastChild, st.phase === 'day' ? 'A boost you buy now works for the rest of today.' : 'A boost you buy now works for the whole day ahead. Tomorrow Dex brings new stock.');
      var offers = d.offers.slice().sort(function (a, b) { return (b.kind === 'limited') - (a.kind === 'limited'); });
      var k = offers.map(function (o) { return o.id; }).join(',');
      if (k !== order) {
        order = k; cards = {}; grid.textContent = '';
        offers.forEach(function (o, i) {
          var c = dealCard(o, refresh);
          c.el.style.setProperty('--i', i);
          cards[o.id] = c; grid.append(c.el);
        });
      }
      offers.forEach(function (o) { if (cards[o.id]) cards[o.id].refresh(o); });
      var act = (d.active || []).filter(boostDef), ak = act.join(',');
      if (ak !== activeKey) {
        var grew = activeKey !== null && ak.length > activeKey.length;
        activeKey = ak; activeRow.textContent = '';
        act.forEach(function (id, i) {
          var b = boostDef(id), chip = h('span', { class: 'chip dex-active-chip', role: 'listitem', title: b.desc }, boostDot(b), b.name);
          if (grew && i === act.length - 1) chip.classList.add('is-new');
          activeRow.append(chip);
        });
        if (!act.length) activeRow.append(h('span', { class: 'dex-active-none' }, 'No boosts yet. Pick one below and it starts working right away.'));
      }
    }
    refresh();
    return { el: h('div', { class: 'dex' }, h('div', { class: 'shop-bar' }, strip.el), hero, active, grid, note, empty), refresh: refresh };
  }

  /* ------------------------------------------------------------------ *
   * Opening and closing
   * ------------------------------------------------------------------ */
  var MODALS = {
    shop: { title: 'Shop', icon: 'shop', build: buildShop },
    map: { title: 'Town map', icon: 'map', build: buildMap },
    goals: { title: 'Goals', icon: 'trophy', build: buildGoals },
    dealer: { title: 'Dex\'s Deals', icon: 'dealer', build: buildDealer }
  };
  /** used only when ui.js is not there: a plain panel in #modal-root */
  function fallbackModal(name, def, bodyEl, onClose) {
    var host = document.getElementById('modal-root'), isOpen = true;
    if (!host) return function () {};
    var x = h('button', { class: 'btn btn--icon btn--sm', type: 'button', 'aria-label': 'Close', onclick: close }, SS.ICONS && SS.ICONS.close ? I('close') : '×');
    var wrap = h('div', { class: 'shop-fb', onclick: function (e) { if (e.target === wrap) close(); } },
      h('div', { class: 'panel shop-fb-panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': def.title },
        h('header', { class: 'shop-fb-head' }, h('h2', { class: 'display shop-fb-title' }, I(def.icon), def.title), x),
        h('div', { class: 'shop-fb-body' }, bodyEl)));
    function key(e) { if (e.key === 'Escape') close(); }
    function close() {
      if (!isOpen) return;
      isOpen = false;
      document.removeEventListener('keydown', key);
      wrap.remove();
      SS.sfx('close');
      onClose();
      SS.emit('ui:close', { name: name });
    }
    document.addEventListener('keydown', key);
    host.append(wrap);
    SS.sfx('open');
    SS.emit('ui:open', { name: name });
    x.focus({ preventScroll: true });
    return close;
  }
  function closeModal() {
    var m = modal;
    modal = null;
    if (m && m.close) safe('close modal', m.close);
  }
  function open(name) {
    var def = MODALS[name];
    if (!def || !SS.state || !SS.state.stats) return false;
    closeModal();
    var view = def.build(), m = { name: name, refresh: view.refresh, close: null };
    function onClose() { if (modal === m) modal = null; }
    var UI = SS.UI, viaUI = false;
    if (UI && UI.openModal) {
      try {
        var c = UI.openModal({ id: name, title: def.title, icon: def.icon, body: view.el, wide: true, onClose: onClose });
        viaUI = true;
        m.close = typeof c === 'function' ? c : function () { if (UI.closeModal) UI.closeModal(); };
      } catch (e) { if (window.console) console.error('[SS.Screens] SS.UI.openModal failed, using the plain panel', e); }
    }
    if (!viaUI) m.close = fallbackModal(name, def, view.el, onClose);
    modal = m;
    return true;
  }

  SS.Screens = {
    init: function () {
      sheet = document.getElementById('sheet');
      if (!sheet) return;
      body = sheet.querySelector('.sheet-body') || sheet.appendChild(h('div', { class: 'sheet-body' }));
      foot = sheet.querySelector('.sheet-foot') || sheet.appendChild(h('div', { class: 'sheet-foot' }));
      SS.on('phase', onPhase);
      ['cart', 'recipe', 'price', 'cash', 'upgrade:buy', 'flavor:buy', 'flavor:set', 'location:set', 'location:unlock', 'reputation', 'milestone',
        'dealer:buy', 'boost:on', 'regular:new', 'regular:lost']
        .forEach(function (e) { SS.on(e, onChange); });
      onPhase();
    },
    open: function (name) { return safe('open ' + name, function () { return open(name); }); }
  };
})();

<script>
/* Squeeze Street — main.js: boot, game loop, canvas input, keyboard shortcuts. */
(function () {
  'use strict';
  var SS = window.SS;
  var STEP = 1 / 60, MAX_STEPS = 12;
  var last = 0, acc = 0;

  function tryInit(name, mod) {
    if (!mod || !mod.init) return;
    try { mod.init(); } catch (e) { console.error('[SS] ' + name + '.init failed', e); }
  }

  function frame(now) {
    var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    var st = SS.state;
    if (st && st.phase === 'day' && !SS.paused && SS.Sim && !SS.debugNoSim) {
      acc += dt * (st.settings && st.settings.speed || 1);
      var n = 0;
      while (acc >= STEP && n < MAX_STEPS && SS.state.phase === 'day') {
        try { SS.Sim.update(STEP); } catch (e) { console.error('[SS] Sim.update failed', e); acc = 0; break; }
        acc -= STEP; n++;
      }
      if (n >= MAX_STEPS) acc = 0;                       // dropped frames: do not spiral
    } else acc = 0;
    SS.Render.frame(SS.paused ? 0 : dt);
    requestAnimationFrame(frame);
  }

  /* Taps on the scene: collect tips, squeeze faster. */
  function scenePoint(e) { var r = e.currentTarget.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function hitAt(e) {
    if (!SS.Actors || !SS.Actors.hit) return null;
    var p = scenePoint(e);
    try { return SS.Actors.hit(p.x, p.y); } catch (err) { return null; }
  }
  /* Dex the Dealer takes taps in the morning too; tips and the stand only while open. */
  function sceneLive(st) { return !!st && (st.phase === 'day' || st.phase === 'prep') && !SS.paused && !document.querySelector('#modal-root > *'); }
  function onScenePress(e) {
    var st = SS.state;
    if (!sceneLive(st) || !SS.Sim) return;
    var hit = hitAt(e);
    if (!hit) return;
    if (hit.type === 'dealer') { if (SS.Screens && SS.Screens.open) SS.Screens.open('dealer'); }
    else if (st.phase !== 'day') return;
    else if (hit.type === 'tip') SS.Sim.collectTip(hit.id);
    else if (hit.type === 'stand') SS.Sim.tapStand();
  }
  function onSceneMove(e) {
    var st = SS.state, hit = sceneLive(st) ? hitAt(e) : null;
    e.currentTarget.style.cursor = hit && (st.phase === 'day' || hit.type === 'dealer') ? 'pointer' : '';
  }

  /* Keyboard: Space/P pause, 1-3 speed, B bell, M mute. Ignored while typing or on a control. */
  function onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || tag === 'A') return;
    if (document.querySelector('#modal-root > *')) return;
    var st = SS.state, k = e.key.toLowerCase();
    if (!st || !SS.Sim) return;
    if (k === 'm') {
      var on = !(st.settings.sfx || st.settings.music);
      SS.Sim.setSetting('sfx', on); SS.Sim.setSetting('music', on);
      return;
    }
    if (st.phase !== 'day') return;
    if (k === ' ' || k === 'p') { e.preventDefault(); SS.setPaused(!SS.paused); }
    else if (k === '1' || k === '2' || k === '3') SS.Sim.setSetting('speed', Number(k));
    else if (k === 'b' && !SS.paused) SS.Sim.ringBell();
  }

  function boot() {
    tryInit('Render', SS.Render);
    tryInit('Sim', SS.Sim);
    tryInit('UI', SS.UI);
    tryInit('Screens', SS.Screens);
    if (SS.Debug) { try { SS.Debug.run(); } catch (e) { console.error('[SS] debug failed', e); } }

    var scene = document.getElementById('scene');
    scene.addEventListener('pointerdown', onScenePress);
    scene.addEventListener('pointermove', onSceneMove);
    window.addEventListener('keydown', onKey);
    var unlock = function () { if (SS.Audio && SS.Audio.unlock) { try { SS.Audio.unlock(); } catch (e) { /* optional */ } } };
    window.addEventListener('pointerdown', unlock, { passive: true });
    window.addEventListener('keydown', unlock);
    // leaving the tab mid-day pauses so nothing is missed
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && SS.state && SS.state.phase === 'day') SS.setPaused(true);
    });
    SS.on('phase', function (p) { SS.setPaused(false); document.getElementById('game').dataset.phase = p.to; });

    // tell every module where we are, now that all of them are listening
    SS.emit('phase', { from: null, to: SS.state ? SS.state.phase : 'title' });
    last = performance.now();
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

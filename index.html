<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Squeeze Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
/* Squeeze Street — base.css
 * Layout: one full-bleed living scene (canvas) with chunky sticker-style UI floating on top.
 * This file owns tokens, the page frame and the shared components.
 * ui.css and screens.css build on it and must not redefine anything here.
 * Single deliberate look (a sunny cartoon world), so there is no light/dark split.
 */
:root {
  /* colour */
  --ink: #1b1f3b;            /* outlines and text */
  --ink-soft: #5a5f85;       /* secondary text */
  --ink-faint: #c9cde6;      /* hairlines, disabled */
  --paper: #ffffff;
  --paper-2: #f1f4ff;        /* cool tint for wells */
  --lemon: #ffd83d;
  --lemon-deep: #f2ae00;
  --lemon-pale: #fff4b8;
  --leaf: #35c977;
  --leaf-deep: #1c9655;
  --coral: #ff6257;
  --coral-deep: #d83a30;
  --berry: #ff5d8f;
  --sky: #4cc3f0;
  --sky-deep: #2487d1;
  --grape: #7a5cff;
  --night: #131a3a;          /* page ground behind the canvas */
  --good: var(--leaf-deep);
  --bad: var(--coral-deep);

  /* type */
  --font-display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Figtree', ui-rounded, 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.625rem;
  --fs-2xl: 2.25rem;
  --fs-3xl: 3.25rem;

  /* shape */
  --line: 3px;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --drop: 0 4px 0 var(--ink);
  --drop-lg: 0 7px 0 var(--ink);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;

  --hud-h: 60px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --swift: cubic-bezier(.2, .8, .2, 1);

  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.35;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- frame ---------- */
#game { position: relative; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; background: var(--night); }
#scene, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx { z-index: 30; pointer-events: none; }
#ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui > #banner-root, #ui > #toast-root, #ui > #coach-root, #ui > #modal-root { pointer-events: none; }
#banner-root > *, #toast-root > *, #coach-root > *, #modal-root > * { pointer-events: auto; }

#hud { position: absolute; top: 10px; left: var(--gutter-l); right: var(--gutter-r); min-height: var(--hud-h); z-index: 5; }
#banner-root { position: absolute; top: calc(var(--hud-h) + 22px); left: var(--gutter-l); right: var(--gutter-r); display: flex; flex-direction: column; align-items: center; gap: var(--s2); z-index: 6; }
#daybar { position: absolute; left: var(--gutter-l); right: var(--gutter-r); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 5; }
#title { position: absolute; inset: 0; z-index: 8; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
#modal-root { position: absolute; inset: 0; z-index: 20; }
#toast-root { position: absolute; left: var(--gutter-l); right: var(--gutter-r); bottom: max(96px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column-reverse; align-items: center; gap: var(--s2); z-index: 25; }
#coach-root { position: absolute; inset: 0; z-index: 22; }

/* The phase panel. Narrow screens: bottom sheet. Wide screens: docked on the right.
   data-mode="center" is a centred card (results). Put scrolling content in .sheet-body
   and an always-visible action row in .sheet-foot. */
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  max-height: 64%;
  display: flex; flex-direction: column;
  background: var(--paper);
  border: var(--line) solid var(--ink); border-bottom: 0;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: 0 -6px 0 rgba(19, 26, 58, .18);
  overflow: hidden;
}
#sheet[data-mode="center"] {
  top: calc(var(--hud-h) + 22px); bottom: 12px; max-height: none;
  left: var(--gutter-l); right: var(--gutter-r);
  width: auto; max-width: 780px; margin-inline: auto;
  border-bottom: var(--line) solid var(--ink); border-radius: var(--r-lg);
  box-shadow: var(--drop-lg);
}
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--s4); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.sheet-foot { flex: 0 0 auto; padding: var(--s3) var(--gutter-r) max(var(--s3), env(safe-area-inset-bottom, 0px)) var(--gutter-l); border-top: var(--line) solid var(--ink); background: var(--paper-2); display: flex; gap: var(--s3); align-items: center; }
#sheet[data-mode="center"] .sheet-body, #sheet[data-mode="center"] .sheet-foot { padding-left: var(--s4); padding-right: var(--s4); }

@media (min-width: 900px) and (min-aspect-ratio: 5/4) {
  #sheet[data-mode="dock"] {
    top: calc(var(--hud-h) + 22px); bottom: 16px; left: auto; right: var(--gutter-r);
    width: min(460px, 40%); max-height: none;
    border-bottom: var(--line) solid var(--ink); border-radius: var(--r-lg);
    box-shadow: var(--drop-lg);
  }
  #sheet[data-mode="dock"] .sheet-body, #sheet[data-mode="dock"] .sheet-foot { padding-left: var(--s4); padding-right: var(--s4); }
}
@media (max-width: 520px) { :root { --hud-h: 52px; } }

/* ---------- type ---------- */
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: .01em; line-height: 1.05; text-wrap: balance; }
.label { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
.muted { color: var(--ink-soft); }
.good { color: var(--good); }
.bad { color: var(--bad); }

/* ---------- icon ---------- */
.ico { display: inline-flex; width: 1.3em; height: 1.3em; flex: 0 0 auto; vertical-align: -0.28em; }
.ico svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ico--lg { width: 2em; height: 2em; }
.ico--xl { width: 3em; height: 3em; }

/* ---------- button ---------- */
.btn {
  --btn-bg: var(--paper);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 44px; padding: 8px 16px;
  font-weight: 800; font-size: var(--fs-md); line-height: 1.1; text-align: center; white-space: nowrap;
  background: var(--btn-bg); color: var(--ink);
  border: var(--line) solid var(--ink); border-radius: var(--r-md);
  box-shadow: var(--drop);
  transform: translateY(0);
  transition: transform .09s var(--swift), box-shadow .09s var(--swift), filter .15s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); filter: brightness(1.04); }
.btn:active, .btn.is-pressed { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.btn:focus-visible, .stepper-btn:focus-visible, .range:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; }
.btn[disabled], .btn[aria-disabled="true"] { --btn-bg: #e6e8f4; color: #8b8fad; border-color: #8b8fad; box-shadow: 0 4px 0 #8b8fad; cursor: not-allowed; transform: none; filter: none; }
.btn--primary { --btn-bg: var(--lemon); }
.btn--go { --btn-bg: var(--leaf); color: #06311a; }
.btn--danger { --btn-bg: var(--coral); color: #fff; }
.btn--sky { --btn-bg: var(--sky); }
.btn--ghost { --btn-bg: transparent; box-shadow: none; border-color: transparent; }
.btn--ghost:hover { --btn-bg: var(--paper-2); box-shadow: none; transform: none; }
.btn--sm { min-height: 36px; padding: 5px 12px; font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn--lg { min-height: 56px; padding: 12px 24px; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-lg); letter-spacing: .02em; border-radius: 20px; box-shadow: var(--drop-lg); }
.btn--lg:hover { box-shadow: 0 9px 0 var(--ink); }
.btn--lg:active { transform: translateY(7px); box-shadow: 0 0 0 var(--ink); }
.btn--icon { width: 44px; min-width: 44px; padding: 0; }
.btn--icon.btn--sm { width: 36px; min-width: 36px; }
.btn--block { display: flex; width: 100%; }

/* ---------- surfaces ---------- */
.panel { background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r-md); box-shadow: var(--drop); }
.well { background: var(--paper-2); border: 2px solid var(--ink-faint); border-radius: var(--r-md); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; min-height: 28px; font-size: var(--fs-sm); font-weight: 800; white-space: nowrap; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; }
.chip--lemon { background: var(--lemon); }
.chip--good { background: #c9f5dc; }
.chip--bad { background: #ffd3cf; }
.chip--sky { background: #cdeeff; }

/* ---------- stepper (built by SS.stepper) ---------- */
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper-btn { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center; padding: 0; font-family: var(--font-display); font-size: 1.4rem; line-height: 1; background: var(--lemon); border: var(--line) solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); transition: transform .08s var(--swift), box-shadow .08s var(--swift); touch-action: none; }
.stepper-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.stepper-btn[disabled] { background: #e6e8f4; color: #8b8fad; border-color: #8b8fad; box-shadow: 0 3px 0 #8b8fad; cursor: not-allowed; transform: none; }
.stepper-val { min-width: 3.2ch; text-align: center; font-weight: 900; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
.stepper-val.bump { animation: ss-bump .22s var(--spring); }

/* ---------- range ---------- */
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; }
.range::-webkit-slider-runnable-track { height: 12px; background: var(--paper-2); border: var(--line) solid var(--ink); border-radius: 999px; }
.range::-moz-range-track { height: 6px; background: var(--paper-2); border: var(--line) solid var(--ink); border-radius: 999px; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; background: var(--lemon); border: var(--line) solid var(--ink); border-radius: 50%; box-shadow: 0 3px 0 var(--ink); }
.range::-moz-range-thumb { width: 22px; height: 22px; background: var(--lemon); border: var(--line) solid var(--ink); border-radius: 50%; box-shadow: 0 3px 0 var(--ink); }

/* ---------- meter: <div class="meter" style="--v:.6"><i></i></div> ---------- */
.meter { position: relative; height: 14px; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.meter > i { position: absolute; inset: 0; width: calc(var(--v, 0) * 100%); background: var(--meter-fill, var(--leaf)); border-right: 2px solid var(--ink); border-radius: 999px 0 0 999px; transition: width .5s var(--swift); }

/* ---------- stars (built by SS.starsHTML) ---------- */
.stars { position: relative; display: inline-flex; white-space: nowrap; line-height: 1; vertical-align: middle; }
.stars-off { display: inline-flex; color: var(--ink-faint); filter: grayscale(1) opacity(.45); }
.stars-on { position: absolute; left: 0; top: 0; display: inline-flex; overflow: hidden; transition: width .6s var(--swift); }
.stars .ico { width: 1.15em; height: 1.15em; vertical-align: 0; }

/* ---------- shared motion ---------- */
@keyframes ss-bump { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
@keyframes ss-pop-in { 0% { opacity: 0; transform: scale(.7); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
@keyframes ss-rise { 0% { opacity: 0; transform: translateY(22px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes ss-drop { 0% { opacity: 0; transform: translateY(-22px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes ss-wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
@keyframes ss-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes ss-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes ss-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes ss-spin { to { transform: rotate(360deg); } }

/* Tone everything down when asked. #game gets .reduced from the setting too. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
#game.reduced *, #game.reduced *::before, #game.reduced *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

</style>
<style>
/* Squeeze Street — ui.css
 * The shell that floats over the scene: HUD, title, day bar, pause card, modals, toasts,
 * banners, coach tips, settings and the win screen. Built by js/ui.js on top of base.css.
 * Class prefixes: hud- daybar- title- modal- toast- banner- coach- pause- set- win-
 */

.hud-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.hud-ico { display: inline-flex; flex: 0 0 auto; }
.hud-ico .ico { vertical-align: 0; }

/* The shell's own controls get the same focus ring as .btn */
.hud-loc:focus-visible, .hud-menu-item:focus-visible, .daybar-bell:focus-visible, .set-row:focus-visible, .coach-skip:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; }
.daybar-speed-btn:focus-visible { outline: 3px solid var(--grape); outline-offset: -4px; }

/* ====================================================================== *
 * HUD
 * ====================================================================== */
#hud { display: flex; align-items: flex-start; gap: var(--s2); pointer-events: none; animation: ss-drop .4s var(--swift) backwards; }
#hud > * { pointer-events: auto; }
#hud.is-menu-open { z-index: 7; }

.hud-bar { display: flex; align-items: stretch; flex: 0 0 auto; height: 44px; min-width: 0; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 14px; box-shadow: var(--drop); }
.hud-seg { display: flex; align-items: center; gap: 6px; min-width: 0; margin: 0; padding: 0 12px; font-weight: 800; font-size: var(--fs-md); line-height: 1; white-space: nowrap; color: var(--ink); background: none; border: 0; }
.hud-seg + .hud-seg { border-left: 2px solid var(--ink-faint); }
.hud-seg:first-child { border-radius: 11px 0 0 11px; }
.hud-seg:last-child { border-radius: 0 11px 11px 0; }
.hud-seg .ico { width: 1.5em; height: 1.5em; vertical-align: 0; }

.hud-day { align-items: center; gap: 6px; padding: 0 12px; background: var(--lemon); }
.hud-day .label { color: var(--ink); }
.hud-day-num { font-size: 1.5rem; padding-top: 2px; }

.hud-sub { display: contents; }
.hud-ctx { flex: 0 1 auto; }
.hud-loc { position: relative; flex: 0 1 auto; cursor: pointer; transition: background .15s; }
.hud-loc::after { content: ''; position: absolute; inset: -3px 0; }
.hud-loc:hover { background: var(--paper-2); }
.hud-loc.is-fixed { cursor: default; }
.hud-loc.is-fixed:hover { background: none; }
.hud-loc-name { overflow: hidden; text-overflow: ellipsis; }
.hud-wx { flex: 0 0 auto; }
.hud-wx-tag { font-size: 0.625rem; }

.hud-clock { flex: 1 1 150px; max-width: 290px; align-items: center; gap: 12px; padding: 0 18px 0 12px; }
.hud-clock-text { flex: 0 0 auto; min-width: 4.7em; font-weight: 800; line-height: 1; white-space: nowrap; }
.hud-clock-track { position: relative; flex: 1 1 56px; min-width: 44px; height: 10px; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; }
.hud-clock-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--t, 0) * 100%); background: var(--lemon); border-radius: 999px; }
.hud-clock-sun { position: absolute; top: 50%; left: calc(var(--t, 0) * 100%); width: 18px; height: 18px; margin: -9px 0 0 -9px; background: var(--lemon); border: 2px solid var(--ink); border-radius: 50%; }
.hud-clock-sun::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; background: repeating-conic-gradient(var(--lemon-deep) 0 14deg, transparent 14deg 45deg); -webkit-mask: radial-gradient(circle, transparent 0 60%, #000 62%); mask: radial-gradient(circle, transparent 0 60%, #000 62%); animation: ss-spin 14s linear infinite; }

.hud-stats { position: relative; margin-left: auto; }
.hud-rep { gap: 7px; }
.hud-rep-full { display: inline-flex; font-size: 1.05rem; }
.hud-rep-one { display: none; }
.hud-cash { gap: 7px; }
.hud-cash-num { font-size: 1.375rem; padding-top: 2px; }
.hud-cash.is-long .hud-cash-num { font-size: 1.125rem; }
.hud-delta { position: absolute; right: 2px; top: calc(100% + 9px); min-height: 26px; pointer-events: none; box-shadow: 0 3px 0 var(--ink); animation: hud-delta 1.2s var(--swift) both; }
@keyframes hud-delta {
  0% { opacity: 0; transform: translateY(-10px) scale(.7); }
  16% { opacity: 1; transform: translateY(0) scale(1.08); }
  26% { transform: translateY(0) scale(1); }
  72% { opacity: 1; transform: translateY(4px); }
  100% { opacity: 0; transform: translateY(14px); }
}

/* Dex's deals during the day: his face plus a stack of today's boosts */
.hud-deals { position: relative; flex: 0 0 auto; align-items: center; gap: 5px; padding: 0 8px 0 4px; color: var(--ink); background: #f3edff; cursor: pointer; transition: transform .09s var(--swift), box-shadow .09s var(--swift); animation: ss-pop-in .4s var(--spring) backwards; }
.hud-deals:not(.has-boosts) { padding: 0 4px; }
.hud-deals::after { content: ''; position: absolute; inset: -7px -3px; }
.hud-deals:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
.hud-deals:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.hud-deals:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; }
.hud-deals-face { display: inline-flex; }
.hud-deals-face .ico { width: 34px; height: 34px; vertical-align: 0; }
.hud-deals.has-limited .hud-deals-face .ico { animation: ss-wiggle .6s ease-in-out 3; }
.hud-deals-stack { display: inline-flex; align-items: center; }
.hud-deals-stack:empty { display: none; }
.hud-deals-boost { display: grid; place-items: center; width: 26px; height: 26px; margin-left: -8px; background: var(--bc, var(--lemon)); border: 2px solid var(--ink); border-radius: 50%; box-shadow: 0 0 0 2px #f3edff; }
.hud-deals-boost:first-child { margin-left: 0; }
.hud-deals-boost .ico { width: 18px; height: 18px; vertical-align: 0; }
.hud-deals-boost.is-new { animation: ss-pop-in .5s var(--spring) both; }
.hud-deals-more { margin-left: 3px; font-size: var(--fs-xs); font-weight: 900; }
.hud-sub-boosts { display: none; flex: 0 0 auto; align-items: center; margin-left: -4px; }
.hud-sub-boosts .hud-deals-boost { width: 16px; height: 16px; margin-left: -5px; border-width: 1.5px; box-shadow: 0 0 0 1.5px var(--paper); }
.hud-sub-boosts .hud-deals-boost:first-child { margin-left: 0; }
.hud-sub-boosts .hud-deals-boost .ico { width: 11px; height: 11px; }
.hud-sub-boosts .hud-deals-more { font-size: .625rem; }
.hud-deals-dot { position: absolute; top: -6px; right: -6px; display: none; width: 14px; height: 14px; background: var(--berry); border: 2px solid var(--ink); border-radius: 50%; }
.hud-deals.has-limited .hud-deals-dot { display: block; animation: ss-pulse 1.2s ease-in-out infinite; }

.hud-btns { display: flex; flex: 0 0 auto; gap: var(--s2); }
.hud-btns .ico, .hud-menu-btn .ico, .title-corner .ico, .daybar-pause .ico, .modal-x .ico { width: 1.5em; height: 1.5em; vertical-align: 0; }
.hud-menu-btn { display: none; flex: 0 0 auto; }
.hud-menu-btn::after { content: ''; position: absolute; inset: -8px -5px; }
.hud-menu { position: absolute; top: calc(100% + 10px); right: 0; z-index: 2; display: flex; flex-direction: column; gap: 2px; min-width: 210px; padding: 6px; transform-origin: 100% 0; animation: ss-pop-in .22s var(--spring) backwards; }
.hud-menu-item { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; font-weight: 800; text-align: left; color: var(--ink); background: none; border: 0; border-radius: 10px; }
.hud-menu-item:hover { background: var(--paper-2); }
.hud-menu-item .ico { width: 1.5em; height: 1.5em; vertical-align: 0; }

/* Not enough room for five stars and three buttons: one star, one menu */
@media (max-width: 999px) {
  .hud-btns { display: none; }
  .hud-menu-btn { display: inline-flex; }
  .hud-rep-full { display: none; }
  .hud-rep-one { display: inline-flex; }
  .hud-wx-tag { display: none; }
  .hud-seg { padding: 0 10px; }
  .hud-clock { padding: 0 16px 0 10px; gap: 10px; }
}

/* Dex's button needs room too: on mid-size screens fold the buttons into the menu while he is in town */
@media (min-width: 900px) and (max-width: 1199px) {
  #hud.has-deals .hud-btns, #hud.has-deals .hud-rep-full, #hud.has-deals .hud-wx-tag { display: none; }
  #hud.has-deals .hud-menu-btn, #hud.has-deals .hud-rep-one { display: inline-flex; }
  .hud-deals-face .ico { width: 30px; height: 30px; }
  .hud-deals-boost { width: 22px; height: 22px; margin-left: -10px; }
  .hud-deals-boost .ico { width: 15px; height: 15px; }
}
/* Tablets and phones: one row of stickers, plus one slim strip for where / weather / time.
   The pair must stay inside --hud-h + 12px, because banners and the results card start right below. */
@media (max-width: 899px) {
  #hud { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "day deals stats menu" "sub sub sub sub"; gap: 4px 8px; align-items: start; }
  .hud-deals { grid-area: deals; }
  .hud-deals-face .ico { width: 28px; height: 28px; }
  .hud-deals-boost { width: 22px; height: 22px; margin-left: -9px; }
  .hud-deals-boost .ico { width: 15px; height: 15px; }
  .hud-bar { height: 36px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
  .hud-seg:first-child { border-radius: 9px 0 0 9px; }
  .hud-seg:last-child { border-radius: 0 9px 9px 0; }
  .hud-day { grid-area: day; }
  .hud-day-num { font-size: 1.375rem; }
  .hud-stats { grid-area: stats; justify-self: end; margin: 0; max-width: 100%; }
  .hud-cash-num { font-size: 1.25rem; }
  .hud-menu-btn { grid-area: menu; width: 42px; min-width: 42px; height: 36px; min-height: 36px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
  .hud-menu-btn:hover { box-shadow: 0 5px 0 var(--ink); }
  .hud-menu-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .hud-menu { top: 46px; }

  .hud-sub { grid-area: sub; justify-self: start; display: flex; align-items: center; gap: 12px; max-width: 100%; min-width: 0; height: 22px; padding: 0 10px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; }
  #hud.is-day .hud-sub { width: min(100%, 470px); }
  .hud-sub .hud-bar { height: auto; background: none; border: 0; border-radius: 0; box-shadow: none; }
  .hud-sub .hud-seg { padding: 0; gap: 4px; font-size: var(--fs-xs); border-radius: 0; }
  .hud-sub .hud-seg + .hud-seg { margin-left: 10px; border-left: 0; }
  .hud-sub .hud-seg .ico { width: 1.25em; height: 1.25em; }
  .hud-loc:hover { background: none; }
  .hud-loc::after { content: ''; position: absolute; inset: -15px -6px; }
  .hud-clock { flex: 1 1 80px; max-width: none; gap: 8px; padding: 0 6px 0 0; }
  .hud-clock-text { min-width: 4.5em; font-size: var(--fs-xs); }
  .hud-clock-track { height: 8px; }
  .hud-clock-sun { width: 14px; height: 14px; margin: -7px 0 0 -7px; }
  .hud-clock-sun::before { inset: -5px; }
  .hud-delta { top: calc(100% + 32px); }
}
@media (max-width: 520px) {
  #hud { gap: 6px; }
  .hud-deals, .hud-deals:not(.has-boosts) { padding: 0 3px; }
  .hud-deals-stack { display: none; }
  .hud-deals-face .ico { width: 26px; height: 26px; }
  #hud.is-day .hud-sub-boosts:not(:empty) { display: inline-flex; }
  .hud-bar { height: 34px; }
  .hud-seg { padding: 0 8px; gap: 5px; font-size: var(--fs-sm); }
  .hud-day { padding: 0 9px; gap: 5px; }
  .hud-day-num { font-size: 1.25rem; }
  .hud-cash-num { font-size: 1.125rem; }
  .hud-cash.is-long .hud-cash-num { font-size: 1rem; }
  .hud-menu-btn { width: 40px; min-width: 40px; height: 34px; min-height: 34px; }
  .hud-menu { top: 44px; }
  .hud-sub { gap: 10px; height: 20px; padding: 0 9px; }
  .hud-delta { top: calc(100% + 30px); }
  #banner-root { padding-top: 4px; }
}

/* ====================================================================== *
 * Day bar
 * ====================================================================== */
#daybar { display: flex; justify-content: center; pointer-events: none; animation: ss-rise .4s var(--swift) backwards; }
#daybar > * { pointer-events: auto; }
.daybar-panel { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: min(100%, 560px); padding: 8px 10px; border-radius: 20px; }
.daybar-ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daybar-stats { display: flex; align-items: center; justify-content: space-between; gap: 2px; padding-top: 6px; border-top: 2px solid var(--ink-faint); }

.daybar-bell { --p: 1; position: relative; flex: 0 0 auto; width: 52px; height: 52px; padding: 0; color: var(--ink); background: none; border: 0; border-radius: 50%; }
.daybar-bell::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--leaf) calc(var(--p) * 360deg), #d9dcec 0); border: var(--line) solid var(--ink); box-shadow: var(--drop); transition: transform .09s var(--swift), box-shadow .09s var(--swift); }
.daybar-bell:active::before { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.daybar-bell-face { position: absolute; inset: 8px; display: grid; place-items: center; font-size: 20px; background: var(--lemon); border: 2px solid var(--ink); border-radius: 50%; transition: transform .09s var(--swift), background .2s; }
.daybar-bell:active .daybar-bell-face { transform: translateY(3px); }
.daybar-bell-face .ico { width: 1.4em; height: 1.4em; vertical-align: 0; }
.daybar-bell:not(.is-cooling) .daybar-bell-face .ico { animation: ss-pulse 1.5s ease-in-out infinite; }
.daybar-bell.is-cooling .daybar-bell-face { background: #eceef8; }
.daybar-bell.is-cooling .daybar-bell-face .ico { opacity: .45; }
.daybar-bell.is-ringing .daybar-bell-face .ico { opacity: 1; animation: ss-wiggle .28s linear infinite; }
.daybar-bell-cd { position: absolute; right: -5px; bottom: -4px; display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; font-size: var(--fs-xs); font-weight: 900; line-height: 1; color: #fff; background: var(--ink); border-radius: 999px; }
.daybar-bell-cd:empty { display: none; }

.daybar-price { display: flex; align-items: center; gap: 8px; }
.daybar-price .label { display: none; }
.daybar-price .stepper-val { min-width: 4.3ch; }
.daybar-price .stepper-btn { position: relative; }
.daybar-price .stepper-btn::after { content: ''; position: absolute; inset: -8px -6px; }   /* 46 x 50 touch target */

.daybar-speed { display: flex; flex: 0 0 auto; height: 50px; overflow: hidden; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 14px; box-shadow: var(--drop); }
.daybar-speed-btn { min-width: 44px; padding: 0 6px; font-weight: 900; font-size: var(--fs-md); color: var(--ink); background: none; border: 0; transition: background .15s; }
.daybar-speed-btn + .daybar-speed-btn { border-left: 2px solid var(--ink); }
.daybar-speed-btn:hover { background: var(--paper-2); }
.daybar-speed-btn.is-on { background: var(--sky); }
.daybar-pause { flex: 0 0 auto; width: 50px; min-width: 50px; min-height: 50px; }

.daybar-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 30px; padding: 2px 3px; font-size: var(--fs-xs); line-height: 1.15; border: 2px solid transparent; border-radius: 10px; }
.daybar-stat .ico { width: 22px; height: 22px; vertical-align: 0; }
.daybar-stat b { font-weight: 800; color: var(--ink); white-space: nowrap; }
.daybar-stat.is-low { background: var(--lemon-pale); border-color: var(--lemon-deep); }
.daybar-stat.is-out { background: #ffd3cf; border-color: var(--coral-deep); }
.daybar-sold { color: var(--lemon); }
.daybar-sep { flex: 0 0 2px; align-self: stretch; margin: 3px 1px; background: var(--ink-faint); border-radius: 2px; }

.daybar-pit { display: flex; align-items: center; gap: 5px; padding: 2px 2px; }
.daybar-pit > .ico { width: 26px; height: 26px; vertical-align: 0; }
.daybar-pit-col { display: flex; flex-direction: column; gap: 3px; min-width: 46px; font-size: var(--fs-xs); line-height: 1.1; }
.daybar-pit-meter { --meter-fill: var(--lemon); height: 10px; }
.daybar-pit.is-brew .daybar-pit-meter > i, .daybar-float-meter > i { transition: width .12s linear; background: repeating-linear-gradient(-45deg, var(--lemon) 0 7px, var(--lemon-deep) 7px 14px); background-size: 200% 100%; animation: daybar-stripes 1.2s linear infinite; }
@keyframes daybar-stripes { to { background-position: -39.6px 0; } }

.daybar-float { position: absolute; left: 50%; bottom: calc(100% + 12px); display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 14px 5px 8px; font-size: var(--fs-sm); font-weight: 800; white-space: nowrap; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 999px; box-shadow: var(--drop); transform: translateX(-50%); animation: daybar-float-in .28s var(--spring) backwards; }
.daybar-float.is-out { padding-right: 5px; background: #ffe3e0; }
.daybar-float .ico { width: 1.6em; height: 1.6em; }
.daybar-float-meter { flex: 0 0 56px; height: 12px; }
@keyframes daybar-float-in { 0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.85); } 100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }

/* Tight spaces show only the current speed; tapping it steps to the next one (ui.js checks for the hidden buttons) */
@media (max-width: 479px), (max-width: 959px) and (max-height: 480px) {
  .daybar-speed-btn:not(.is-on) { display: none; }
  .daybar-speed-btn.is-on { min-width: 48px; }
}
@media (min-width: 480px) {
  .daybar-ctl { justify-content: center; gap: 14px; }
  .daybar-price .label { display: inline; }
  .daybar-stats { justify-content: center; gap: 8px; }
  .daybar-stat { min-width: 38px; }
}
/* One roomy row on wide screens, one compact row on a phone held sideways */
@media (min-width: 1100px), (min-width: 760px) and (max-height: 480px) {
  .daybar-panel { flex-direction: row; align-items: center; width: auto; max-width: 100%; gap: 14px; padding: 8px 14px; }
  .daybar-ctl { display: contents; }
  .daybar-bell { order: 1; }
  .daybar-price { order: 2; }
  .daybar-stats { order: 3; gap: 6px; padding: 0 14px; border-top: 0; border-left: 2px solid var(--ink-faint); border-right: 2px solid var(--ink-faint); }
  .daybar-speed { order: 4; }
  .daybar-pause { order: 5; }
}
@media (min-width: 1100px) and (min-height: 481px) {
  .daybar-price { flex-direction: column; gap: 1px; }
  .daybar-stat { min-width: 44px; font-size: var(--fs-sm); }
  .daybar-stat .ico { width: 26px; height: 26px; }
  .daybar-pit > .ico { width: 32px; height: 32px; }
  .daybar-pit-col { min-width: 62px; font-size: var(--fs-sm); }
  .daybar-stats { gap: 8px; }
}
@media (min-width: 760px) and (max-height: 480px) {
  .daybar-price .label { display: none; }
  .daybar-panel { gap: 10px; padding: 6px 12px; }
  .daybar-stats { padding: 0 10px; gap: 4px; }
}

/* ====================================================================== *
 * Pause card
 * ====================================================================== */
.pause-layer { position: absolute; inset: 0; z-index: 18; display: grid; place-items: center; padding: 16px var(--gutter-r) 16px var(--gutter-l); background: rgba(19, 26, 58, .5); animation: modal-fade .2s ease-out backwards; }
.pause-card { display: flex; flex-direction: column; gap: var(--s3); width: min(340px, 100%); max-height: 100%; overflow-y: auto; padding: var(--s5) var(--s5) var(--s4); text-align: center; border-radius: var(--r-lg); box-shadow: var(--drop-lg); animation: ss-pop-in .3s var(--spring) backwards; }
.pause-card:focus { outline: none; }
.pause-title { margin: 0; font-size: var(--fs-3xl); color: var(--ink); }
.pause-text { margin: 0 0 var(--s1); font-size: var(--fs-sm); color: var(--ink-soft); }
.pause-card .btn .ico { width: 1.4em; height: 1.4em; vertical-align: 0; }
.pause-keys { display: none; flex-wrap: wrap; justify-content: center; gap: 6px 12px; margin: var(--s1) 0 0; padding-top: var(--s3); font-size: var(--fs-xs); font-weight: 700; color: var(--ink-soft); border-top: 2px solid var(--ink-faint); }
.pause-keys span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.pause-key { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; font: inherit; font-weight: 800; color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; }
@media (hover: hover) and (pointer: fine) { .pause-keys { display: flex; } }
@media (max-height: 480px) {
  .pause-card { gap: var(--s2); padding: var(--s3) var(--s4); }
  .pause-title { font-size: var(--fs-2xl); }
  .pause-text { display: none; }
  .pause-card .btn--lg { min-height: 48px; }
  .pause-keys { padding-top: var(--s2); }
}

/* ====================================================================== *
 * Modals
 * ====================================================================== */
.modal-layer { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px var(--gutter-r) max(18px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
#modal-root > .modal-layer.is-closing { pointer-events: none; opacity: 0; transition: opacity .16s ease-in; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(19, 26, 58, .58); animation: modal-fade .2s ease-out backwards; }
@keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
.modal-card { position: relative; display: flex; flex-direction: column; width: min(520px, 100%); max-height: 100%; min-height: 0; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r-lg); box-shadow: var(--drop-lg); animation: ss-pop-in .3s var(--spring) backwards; }
.modal-card:focus { outline: none; }
.modal-card--wide { width: min(880px, 100%); }
.modal-card--confirm { width: min(410px, 100%); }
.modal-layer.is-closing .modal-card { transform: scale(.94); transition: transform .16s ease-in; }
.modal-head { flex: 0 0 auto; display: flex; align-items: center; gap: var(--s3); min-height: 58px; padding: 8px 10px 8px var(--s4); background: var(--lemon); border-bottom: var(--line) solid var(--ink); border-radius: 21px 21px 0 0; }
.modal-head > .ico { width: 2.1em; height: 2.1em; }
.modal-layer[data-modal="dealer"] .modal-head { background: #c9b3ff; }
.modal-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--fs-xl); color: var(--ink); }
.modal-x { flex: 0 0 auto; }
.modal-body { flex: 1 1 auto; min-height: 0; padding: var(--s4); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; border-radius: 0 0 21px 21px; }
.modal-text { margin: 0 0 var(--s4); font-size: var(--fs-md); color: var(--ink); }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s3); padding-bottom: 5px; }
.modal-actions .btn { flex: 1 1 130px; white-space: normal; }

.modal-how-list { display: flex; flex-direction: column; gap: var(--s3); margin: 0 0 var(--s4); padding: 0; list-style: none; counter-reset: how; }
.modal-how-item { display: flex; align-items: flex-start; gap: var(--s3); counter-increment: how; }
.modal-how-item > .ico { width: 2.4em; height: 2.4em; margin-top: 1px; }
.modal-how-item b { display: block; font-size: var(--fs-md); font-weight: 800; }
.modal-how-item b::before { content: counter(how) '. '; color: var(--ink-soft); }
.modal-how-item p { margin: 2px 0 0; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-soft); }
.modal-how-goal { margin: 0 0 var(--s4); padding: var(--s3); font-size: var(--fs-sm); font-weight: 700; }
.modal-how .btn--block { margin-bottom: 5px; }

/* ---------- settings ---------- */
.set-body { display: flex; flex-direction: column; gap: var(--s2); }
.set-row { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 60px; padding: 8px 12px; text-align: left; color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink-faint); border-radius: var(--r-md); transition: background .15s, border-color .15s; }
.set-row:hover { border-color: var(--ink-soft); }
.set-row[aria-checked="true"] { background: #e9fbf1; border-color: var(--leaf-deep); }
.set-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.set-text b { font-weight: 800; }
.set-desc { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-soft); }
.set-knob { position: relative; flex: 0 0 auto; width: 52px; height: 30px; background: #d5d8ea; border: var(--line) solid var(--ink); border-radius: 999px; transition: background .18s; }
.set-knob::after { content: ''; position: absolute; top: 1px; left: 1px; width: 22px; height: 22px; background: var(--paper); border: 2px solid var(--ink); border-radius: 50%; transition: transform .22s var(--spring); }
.set-row[aria-checked="true"] .set-knob { background: var(--leaf); }
.set-row[aria-checked="true"] .set-knob::after { transform: translateX(22px); }
.set-actions { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s3); padding-bottom: 5px; }
.set-actions .btn { flex: 1 1 150px; }
.set-actions .btn .ico { width: 1.4em; height: 1.4em; vertical-align: 0; }
.set-reset { color: #a3190f; }
.set-note { margin: var(--s2) 0 0; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-soft); text-align: center; }

/* ====================================================================== *
 * Toasts
 * ====================================================================== */
.toast { display: flex; align-items: center; gap: 8px; max-width: min(440px, 100%); padding: 8px 16px 8px 12px; font-size: var(--fs-sm); font-weight: 700; line-height: 1.3; color: var(--ink); background: var(--paper); border: var(--line) solid var(--ink); border-radius: 18px; box-shadow: var(--drop); animation: ss-rise .3s var(--swift) backwards; transition: opacity .2s, transform .2s; }
.toast .ico { width: 1.7em; height: 1.7em; vertical-align: 0; }
.toast--good { background: #d5f8e3; }
.toast--bad { background: #ffdcd8; }
.toast.is-out { opacity: 0; transform: translateY(8px) scale(.96); }
#toast-root > .toast { pointer-events: none; }               /* nothing to press in a toast: taps go through */
#toast-root.is-over-modal { top: 10px; bottom: auto; flex-direction: column; }
#toast-root.is-over-modal .toast { box-shadow: var(--drop-lg); }

/* ====================================================================== *
 * Banners
 * ====================================================================== */
/* News sits above coach tips and open modals (it never takes clicks), and clear of the docked prep sheet */
#banner-root { z-index: 23; }
#banner-root > .banner { pointer-events: none; }
#banner-root.is-held { visibility: hidden; }
@media (min-width: 900px) and (min-aspect-ratio: 5/4) {
  #game[data-phase="prep"] #banner-root { right: calc(var(--gutter-r) + min(460px, 40%)); }
}
/* a phone on its side: the morning scene is a thin strip, so morning news sits over the sheet, just above its buttons */
@media (max-height: 480px) {
  #game[data-phase="prep"] #banner-root { top: auto; bottom: 92px; }
}
.banner { position: relative; display: flex; align-items: center; gap: 10px; max-width: min(470px, 100%); padding: 6px 18px 6px 6px; color: var(--ink); background: var(--paper); border: var(--line) solid var(--ink); border-radius: 999px; box-shadow: var(--drop); transform-origin: 50% 0; animation: banner-in .42s var(--spring) backwards; transition: opacity .22s, transform .22s; }
.banner.is-out { opacity: 0; transform: translateY(-12px) scale(.94); }
@keyframes banner-in { 0% { opacity: 0; transform: translateY(-26px) scale(.8); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
.banner-ico { flex: 0 0 auto; display: grid; place-items: center; width: 42px; height: 42px; font-size: 22px; background: var(--lemon); border: 2px solid var(--ink); border-radius: 50%; }
.banner-ico .ico { vertical-align: 0; }
.banner-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.banner-text .label { font-size: 0.625rem; }
.banner-title { font-size: var(--fs-md); font-weight: 800; }
.banner-desc { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-soft); }
.banner--sky { background: #dff3ff; }
.banner--sky .banner-ico { background: var(--paper); }
.banner--bad { background: #ffe3e0; }
.banner--bad .banner-ico { background: var(--paper); }
.banner--good .banner-ico { background: #b9f2d1; }
.banner--regular { background: #ffe8f1; }
.banner--regular .banner-ico { background: var(--paper); }

}

/* ====================================================================== *
 * GOALS
 * ====================================================================== */
.goal-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2) var(--s3); }

.goal-stat { display: flex; align-items: center; gap: var(--s2); min-width: 0; padding: var(--s2) var(--s3) var(--s2) var(--s2); background: var(--paper-2); border: 2px solid var(--ink); border-radius: var(--r-md); box-shadow: 0 3px 0 var(--ink); }
.goal-stat-ico { width: 32px; height: 32px; }
.goal-stat-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.goal-stat-n { font-size: var(--fs-lg); overflow-wrap: anywhere; }

.goal-all { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.goal-all-text { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }

.goal-list { list-style: none; margin: 0; padding: 0 0 var(--s2); display: flex; flex-direction: column; gap: var(--s2); }
.goal-item { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: var(--s3); padding: var(--s2) var(--s3) var(--s2) var(--s2); background: var(--paper); border: 2px solid var(--ink-faint); border-radius: var(--r-md); animation: ss-rise .35s var(--swift) both; animation-delay: calc(min(var(--i, 0), 10) * 30ms); }
.goal-item.is-done { background: #e3f8ec; border-color: #9bdcb8; }
.goal-item.is-next { padding: calc(var(--s2) - 1px) calc(var(--s3) - 1px) calc(var(--s2) - 1px) calc(var(--s2) - 1px); border: var(--line) solid var(--ink); box-shadow: var(--drop); }
.goal-mark { display: grid; place-items: center; width: 44px; height: 44px; background: var(--paper-2); border: 2px solid var(--ink-faint); border-radius: 50%; }
.goal-mark .ico { width: 26px; height: 26px; vertical-align: 0; filter: grayscale(1); opacity: .5; }

.goal-item.is-done .goal-mark .ico { filter: none; opacity: 1; }
.goal-main { min-width: 0; }
.goal-top { display: flex; align-items: flex-start; gap: 2px 8px; }
.goal-title { min-width: 0; font-weight: 900; line-height: 1.25; }

.goal-desc { margin: 0; font-size: var(--fs-sm); line-height: 1.3; color: var(--ink-soft); }

.goal-item.is-done .goal-val { color: var(--good); }

/* ====================================================================== *
 * REGULARS AND DEX THE DEALER (shared bits)
 * ====================================================================== */
.boost-dot { flex: 0 0 auto; display: inline-grid; place-items: center; width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 50%; }
.boost-dot .ico { width: 18px; height: 18px; vertical-align: 0; }
.reg-streak { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2px; min-height: 26px; padding: 1px 9px 1px 3px; font-weight: 900; line-height: 1; background: #fff1e0; border: 2px solid var(--ink); border-radius: 999px; }

/* prep: the Deals button and today's boosts */
.prep-deals { position: relative; --btn-bg: #f3edff; }

.prep-deals-badge::after { content: ''; position: absolute; inset: -2px; border: 2px solid var(--berry); border-radius: 50%; animation: prep-ping 1.6s var(--swift) infinite; }
.prep-deals.has-limited .prep-deals-badge { display: block; animation: ss-pulse 1.2s ease-in-out infinite; }
.prep-deals.has-limited .ico { animation: ss-wiggle .6s ease-in-out 1.2s 2; }
@keyframes prep-ping { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.3); } }

}

/* results: the tally's extra rows and the regulars section */
.res-row-dots { display: inline-flex; }

.res-regs-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 36px; }
.res-regs-all { flex: 0 0 auto; }
.res-regs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--s2) var(--s3); }
.res-reg { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: var(--s2) var(--s3); min-width: 0; padding: var(--s2) var(--s3) var(--s2) var(--s2); background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r-md); box-shadow: 0 3px 0 var(--ink); }
.res-reg.res-step.is-in { animation: res-reg-in .5s var(--spring) both; }
@keyframes res-reg-in { 0% { opacity: 0; transform: translateY(18px) scale(.9) rotate(-1.5deg); } 100% { opacity: 1; transform: none; } }
.res-reg-face .ico { display: block; width: 40px; height: 40px; }
.res-reg-main { min-width: 0; }
.res-reg-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.res-reg-name { min-width: 0; font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
.res-reg-kind { font-size: .6875rem; }
.res-reg-new { align-self: center; min-height: 20px; padding: 0 8px; font-size: var(--fs-xs); color: #fff; background: var(--berry); }
.res-reg-line { margin: 2px 0 0; font-size: var(--fs-sm); line-height: 1.3; color: var(--ink-soft); }
.res-reg-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.res-reg--streak { background: #fff6d6; }
.res-reg--streak .res-reg-line { color: var(--ink); font-weight: 700; }
.res-reg--new { background: #ffe8f1; }
.res-reg--saved { background: #e0f4ff; }
.res-reg--broken { background: #fff0ee; }
.res-reg--lost { background: var(--paper-2); border-color: #8b8fad; box-shadow: 0 3px 0 #8b8fad; }
.res-reg--lost .res-reg-face, .res-reg--away .res-reg-face, .res-reg--closed .res-reg-face { filter: grayscale(.8); opacity: .65; }
.res-reg--lost .res-reg-name { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 2px; }
.res-reg--away, .res-reg--closed { background: var(--paper-2); }
.res-reg--streak.is-in .reg-streak .ico { animation: res-flame .7s var(--spring) .3s both; }
.res-reg--new.is-in .res-reg-face .ico { animation: ss-bump .5s var(--spring) .3s; }
.res-reg--saved.is-in .res-reg-face .ico { animation: res-flame .6s var(--spring) .3s both; }

@keyframes res-flame { 0% { transform: scale(.4) rotate(-20deg); } 60% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
.res-regs-empty { margin: 0; display: flex; align-items: center; gap: var(--s3); padding: var(--s3); font-size: var(--fs-sm); font-weight: 700; color: var(--ink-soft); }

/* shop: limited flavors */

.shop-only .ico { width: 30px; height: 30px; }

/* goals: the tab row */

/* the regulars tab */
.regs { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }

@container (max-width: 520px) {
  .regs-tiles .goal-stat { flex-direction: column; align-items: center; gap: 2px; padding: var(--s2) 4px; text-align: center; }

}
.regs-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
.regs-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; grid-template-areas: "face main stats side"; align-items: center; gap: 4px var(--s3); padding: var(--s2) var(--s3) var(--s2) var(--s2); background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r-md); box-shadow: 0 3px 0 var(--ink); animation: ss-rise .35s var(--swift) both; animation-delay: calc(min(var(--i, 0), 12) * 35ms); }
.regs-item:first-child:not(.is-cold) { background: var(--lemon-pale); }
.regs-face { grid-area: face; }
.regs-face .ico { display: block; width: 40px; height: 40px; }
.regs-item.is-cold .regs-face { filter: grayscale(.7); opacity: .7; }

.regs-stats dt { font-size: .625rem; }
.regs-stats dd { margin: 0; font-weight: 900; }
.regs-side { grid-area: side; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
@container (max-width: 520px) {
  .regs-item { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: "face main side" "face stats side"; }
  .regs-stats { gap: var(--s2); }

}
.regs-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s5) var(--s4); text-align: center; }

/* ====================================================================== *
 * DEX THE DEALER
 * ====================================================================== */
.dex { container-type: inline-size; display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.dex-hero { display: flex; align-items: center; gap: var(--s3); }
.dex-avatar { position: relative; flex: 0 0 auto; display: grid; place-items: center; width: 100px; height: 100px; }
.dex-rays { position: absolute; inset: -8px; border-radius: 50%; background: repeating-conic-gradient(#c3a8ff 0 13deg, #f3edff 13deg 30deg); -webkit-mask: radial-gradient(circle, #000 0 42%, transparent 71%); mask: radial-gradient(circle, #000 0 42%, transparent 71%); animation: ss-spin 18s linear infinite; }
.dex-face { position: relative; width: 88px; height: 88px; transform-origin: 50% 92%; animation: dex-pop .55s var(--spring) both, dex-bob 3s ease-in-out .55s infinite; }
@keyframes dex-pop { 0% { opacity: 0; transform: translateY(30px) scale(.5); } 100% { opacity: 1; transform: none; } }
@keyframes dex-bob { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-3px); } }
.dex-bubble { position: relative; flex: 1 1 auto; min-width: 0; margin-left: 6px; padding: 10px 16px 12px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 18px; box-shadow: var(--drop); transform-origin: 0 60%; animation: dex-say .5s var(--spring) .18s both; }
.dex-bubble::before { content: ''; position: absolute; left: -10px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--paper); border: var(--line) solid var(--ink); border-top-color: transparent; border-right-color: transparent; border-radius: 0 0 0 4px; transform: rotate(45deg); }
@keyframes dex-say { 0% { opacity: 0; transform: scale(.6) rotate(-4deg); } 100% { opacity: 1; transform: none; } }
.dex-bubble .label { color: #6c3fd6; }
.dex-line { margin: 2px 0 0; font-size: var(--fs-md); font-weight: 800; line-height: 1.3; }

.dex-active { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: var(--s2) var(--s3); background: var(--paper-2); border: 2px dashed var(--ink-faint); border-radius: var(--r-md); }
.dex-active > .label { flex: 0 0 auto; }
.dex-active-row { flex: 1 1 200px; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.dex-active-chip { gap: 6px; padding: 2px 11px 2px 2px; box-shadow: 0 2px 0 var(--ink); }
.dex-active-chip.is-new { animation: ss-pop-in .5s var(--spring) both; }
.dex-active-none { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-soft); }

.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: var(--s4); padding-bottom: var(--s2); }
.dex-card { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: 1fr auto; gap: var(--s3); min-width: 0; padding: var(--s3); animation: dex-card-in .5s var(--spring) both; animation-delay: calc(var(--i, 0) * 70ms + 140ms); transition: background-color .25s; }
@keyframes dex-card-in { 0% { opacity: 0; transform: translateY(28px) rotate(-2deg) scale(.93); } 100% { opacity: 1; transform: none; } }
.dex-card.shop-shake { animation: ss-shake .35s; }
.dex-art { display: grid; place-items: center; width: 64px; height: 64px; background: var(--bc-pale, var(--paper-2)); border: 2px solid var(--ink); border-radius: var(--r-md); transition: background-color .25s, transform .25s var(--spring); }
.dex-art .ico { width: 46px; height: 46px; }
.dex-card:hover .dex-art { transform: rotate(-6deg) scale(1.05); }
.dex-card.is-on { background: var(--bc-pale, var(--paper)); }
.dex-card.is-on .dex-art { background: var(--bc-mid, var(--lemon)); }
.dex-done { animation: ss-pop-in .4s var(--spring) both; }
.dex-why { color: var(--ink-soft); }
.dex-why.is-alert { color: var(--bad); animation: ss-pop-in .3s var(--spring); }

/* the limited edition: full width, sunburst, ribbon, a glint that sweeps across */
.dex-card--limited { grid-column: 1 / -1; grid-template-columns: 136px minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; gap: var(--s3) var(--s4); padding: var(--s4); overflow: hidden;
  background: repeating-conic-gradient(from -4deg at 15% 40%, var(--fc-pale) 0 9deg, #fff 9deg 18deg); box-shadow: inset 0 0 0 4px var(--fc-mid), var(--drop-lg); }

.dex-card--limited::after { content: ''; position: absolute; top: -30%; bottom: -30%; left: 0; z-index: 1; width: 70px; background: rgba(255, 255, 255, .6); pointer-events: none; transform: translateX(-160px) skewX(-20deg); animation: dex-shine 4.5s ease-in-out 1.2s infinite; }
@keyframes dex-shine { 0%, 55% { transform: translateX(-160px) skewX(-20deg); } 100% { transform: translateX(1200px) skewX(-20deg); } }
.dex-ribbon { position: absolute; top: 30px; left: -34px; z-index: 2; width: 190px; padding: 4px 0 3px; text-align: center; font-family: var(--font-display); font-size: .8125rem; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--berry); border-block: var(--line) solid var(--ink); transform: rotate(-35deg); box-shadow: 0 3px 0 rgba(27, 31, 59, .25); }
.dex-lim-art { position: relative; display: grid; place-items: center; width: 136px; height: 136px; }
.dex-lim-rays { position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(var(--fc) 0 12deg, transparent 12deg 30deg); -webkit-mask: radial-gradient(circle, #000 0 38%, transparent 70%); mask: radial-gradient(circle, #000 0 38%, transparent 70%); animation: ss-spin 12s linear infinite; }
.dex-lim-glass { position: relative; display: grid; place-items: center; width: 100px; height: 100px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: 50%; box-shadow: 0 5px 0 var(--ink); animation: ss-float 2.8s ease-in-out infinite; }

.dex-lim-spark { position: absolute; width: 22px; height: 22px; animation: dex-twinkle 1.9s ease-in-out infinite; animation-delay: calc(var(--i) * -.48s); }
.dex-lim-spark .ico { width: 100%; height: 100%; }

.dex-lim-spark:nth-of-type(2) { bottom: 10px; left: 2px; width: 18px; height: 18px; }

.dex-lim-spark:nth-of-type(4) { top: 30px; left: -2px; width: 14px; height: 14px; }
@keyframes dex-twinkle { 0%, 100% { opacity: .15; transform: scale(.4) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(25deg); } }
.dex-lim-main { position: relative; z-index: 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.dex-lim-kicker { color: var(--ink); opacity: .7; }

.dex-chip-today { color: #fff; background: var(--coral); }

.dex-lim-blurb { color: var(--ink); }
.dex-lim-act .dex-buy { min-height: 54px; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-lg); letter-spacing: .02em; border-radius: 18px; box-shadow: var(--drop-lg); }

@container (max-width: 480px) {
  .dex-hero { gap: var(--s2); }
  .dex-avatar { width: 76px; height: 76px; }
  .dex-face { width: 68px; height: 68px; }
  .dex-line { font-size: var(--fs-sm); }
  .dex-card--limited { grid-template-columns: 100px minmax(0, 1fr); gap: var(--s3); padding: var(--s3); }
  .dex-lim-art { width: 100px; height: 100px; }
  .dex-lim-glass { width: 74px; height: 74px; }

  .dex-lim-name { font-size: var(--fs-xl); }

<body>
<div id="game">
  <canvas id="scene" aria-label="Your lemonade stand"></canvas>
  <div id="ui">
    <header id="hud" hidden></header>
    <div id="banner-root" aria-live="polite"></div>
    <section id="sheet" data-mode="dock" hidden></section>
    <div id="daybar" hidden></div>
    <div id="title" hidden></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="coach-root"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>
<script>
/* Squeeze Street — core.js
 * Namespace, event bus, helpers, data tables and the state shape.
 * THIS FILE IS THE CONTRACT every other module builds against.
 * Classic script (no ES modules) so the game runs from file:// and loads in node for tests.
 */
(function () {
  'use strict';
  var root = typeof window !== 'undefined' ? window : globalThis;
  var SS = (root.SS = root.SS || {});

  SS.VERSION = '1.0.0';
  SS.CURRENCY = '$';
  SS.SAVE_KEY = 'squeeze-street-save-v1';

  /* ------------------------------------------------------------------ *
   * World geometry (world units; the renderer maps them to pixels)
   * x grows to the right. "lane" is depth on the sidewalk: 0 = back (by the
   * buildings), 1 = front (by the curb, nearest the camera).
   * ------------------------------------------------------------------ */
  SS.W = {
    STAND_X: 500,        // centre of the stand counter
    STAND_W: 180,        // counter width (410..590)
    STAND_LANE: 0.3,     // depth of the stand's base; lower lanes pass behind it
    SERVE_X: 372,        // where the customer being served stands (queue slot 0)
    QUEUE_GAP: 44,       // slot i stands at SERVE_X - i * QUEUE_GAP
    QUEUE_LANE: 0.55,    // everyone in line stands on this lane
    SIDEWALK_H: 90,      // depth of the walkable band, world units
    CHAR_H: 110,         // an adult is about this tall, world units
    // Passers-by keep to these lanes so nobody walks through the line:
    PASS_LANES: [[0.04, 0.2], [0.72, 1.0]],
    // Dex the Dealer stands here, beside the stand, between the back lanes and the line
    DEALER_X: 735,
    DEALER_LANE: 0.3
  };

  /* Regulars ----------------------------------------------------------
   * A regular's loyalty multiplier from their streak (happy visits in a row).
   * Shared so the sim, the art and the screens always show the same number. */
  SS.LOYALTY = { step: 0.1, max: 2 };        // x1.1 per happy visit in a row, topping out at x2.0 (a 10-visit streak)
  // The multiplier is a bonus paid on top of the price; it does not raise the most a regular will pay per cup.
  SS.loyaltyMult = function (streak) {
    return Math.min(SS.LOYALTY.max, 1 + SS.LOYALTY.step * Math.max(0, Math.floor(Number(streak) || 0)));
  };
  /** "x1.4" style label for a multiplier */
  SS.fmtMult = function (m) { return 'x' + (Math.round((Number(m) || 1) * 10) / 10).toFixed(1); };

  /* Sim time ---------------------------------------------------------- */
  SS.DAY_LENGTH = 75;    // seconds of sim time in one business day (speed 1x)
  SS.OPEN_HOUR = 9;
  SS.CLOSE_HOUR = 18;
  /** "9:00 AM" style clock label for day progress t in 0..1 */
  SS.clockText = function (t) {
    var mins = Math.round((SS.OPEN_HOUR + (SS.CLOSE_HOUR - SS.OPEN_HOUR) * SS.clamp(t, 0, 1)) * 60 / 5) * 5;
    var h = Math.floor(mins / 60), m = mins % 60;
    return ((h + 11) % 12 + 1) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM');
  };

  /* ------------------------------------------------------------------ *
   * Math helpers
   * ------------------------------------------------------------------ */
  SS.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  SS.lerp = function (a, b, t) { return a + (b - a) * t; };
  SS.remap = function (v, a, b, c, d) { return c + (d - c) * SS.clamp((v - a) / (b - a), 0, 1); };
  SS.smooth = function (t) { t = SS.clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  /** frame-rate independent approach: value moves toward target */
  SS.damp = function (v, target, rate, dt) { return SS.lerp(v, target, 1 - Math.exp(-rate * dt)); };
  SS.ease = {
    inCubic: function (t) { return t * t * t; },
    outCubic: function (t) { return 1 - Math.pow(1 - t, 3); },
    inOutCubic: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
    outQuint: function (t) { return 1 - Math.pow(1 - t, 5); },
    inOutSine: function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; },
    outBack: function (t) { var c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    outElastic: function (t) {
      if (t === 0 || t === 1) return t;
      return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
    },
    outBounce: function (t) {
      var n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
      return n * (t -= 2.625 / d) * t + 0.984375;
    }
  };
  /** deterministic 0..1 hash of an integer (visual variety that never flickers) */
  SS.hash = function (n) {
    n = (n | 0) + 0x6D2B79F5 | 0;
    var t = Math.imul(n ^ (n >>> 15), 1 | n);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  /** seeded PRNG: const rnd = SS.mulberry32(seed); rnd() -> 0..1 */
  SS.mulberry32 = function (a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /** Shared lighting curve so every art layer agrees on when it is dark.
   *  dayT is cyclic 0..1.6 (0 sunrise, 0.5 noon, 1.0 sunset, 1.3 deep night).
   *  -> { night: 0..1 (lamps and windows switch on above ~0.3),
   *       warm: 0..1 (golden-hour glow, peaks at sunrise and sunset),
   *       sun: 0..1 (sun height, 0 below the horizon) } */
  SS.light = function (dayT) {
    var d = ((dayT % 1.6) + 1.6) % 1.6, night, warm;
    if (d < 0.06) night = SS.lerp(0.35, 0, SS.smooth(d / 0.06));
    else if (d < 0.96) night = 0;
    else if (d < 1.3) night = SS.smooth((d - 0.96) / 0.34);
    else if (d < 1.5) night = 1;
    else night = SS.lerp(1, 0.35, SS.smooth((d - 1.5) / 0.1));
    var set = Math.max(0, 1 - Math.abs(d - 1.0) / 0.24), rise = Math.max(0, 1 - Math.min(d, 1.6 - d) / 0.13);
    warm = Math.max(SS.smooth(set), 0.8 * SS.smooth(rise));
    return { night: night, warm: warm, sun: d <= 1 ? Math.sin(Math.PI * d) : 0 };
  };

  /* Formatting -------------------------------------------------------- */
  SS.fmtMoney = function (n) {
    n = Number(n) || 0;
    var neg = n < -0.004, a = Math.abs(n);
    var s = a.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + SS.CURRENCY + s;
  };
  SS.fmtInt = function (n) { return Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
  SS.fmtTemp = function (c) { return Math.round(c) + '°C'; };

  /* ------------------------------------------------------------------ *
   * Event bus. Handlers are isolated: one throwing never breaks the rest.
   * ------------------------------------------------------------------ */
  var handlers = {};
  SS.on = function (evt, fn) { (handlers[evt] = handlers[evt] || []).push(fn); return fn; };
  SS.off = function (evt, fn) { var l = handlers[evt]; if (l) { var i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); } };
  SS.emit = function (evt, payload) {
    var l = handlers[evt];
    if (!l) return;
    l = l.slice();
    for (var i = 0; i < l.length; i++) {
      try { l[i](payload); } catch (e) { if (root.console) console.error('[SS] handler for "' + evt + '" threw', e); }
    }
  };

  /* Bus events (payloads) ----------------------------------------------
   * Sim -> everyone
   *   'phase'            {from, to}            to: 'title'|'prep'|'day'|'results'
   *   'day:start'        {day, weather, event}
   *   'day:end'          {result}              result is a DayResult (see below)
   *   'customer:spawn'   {c}
   *   'customer:join'    {c}                   joined the line
   *   'customer:balk'    {c, reason}           'pricey'|'wait'|'soldout'  (walked on without buying)
   *   'customer:quit'    {c}                   ran out of patience in line
   *   'pour'             {c, duration}         vendor starts pouring for c
   *   'sale'             {c, price, qty, x, lane}
   *   'review'           {c, text, mood, kind} mood -1..1, kind = feedback key
   *   'tip:drop'         {tip}                 tip = {id, x, lane, amount, ttl}
   *   'tip:collect'      {tip, auto}
   *   'brew:start'       {duration}
   *   'brew:done'        {cups}
   *   'brew:tap'         {}                    player tapped the stand to squeeze faster
   *   'soldout'          {missing}             'lemons'|'sugar'|'ice'|'cups'
   *   'bell'             {}
   *   'weather:change'   {type, temp}
   *   'event:trigger'    {id, title, desc, icon}   mid-day surprise or morning news
   *   'cash'             {amount, delta, reason}   reason: 'sale'|'tip'|'loyalty'|'milestone'|'loan' (money in)
   *                                            'supplies'|'flavor'|'upgrade'|'location'|'dealer' (money out)
   *   'reputation'       {value, delta}
   *   'milestone'        {id, title, reward}
   *   'win'              {}                    final milestone reached
   *   'upgrade:buy'      {id, level}
   *   'flavor:buy'       {id}        'flavor:set' {id}
   *   'location:unlock'  {id}        'location:set' {id}
   *   'cart'  'recipe'  'price'      {}        prep values changed (re-read state)
   *   'settings'         {key, value}
   *   'toast'            {text, kind, icon}    kind: 'info'|'good'|'bad'
   *   'save'             {}
   *   -- regulars --
   *   'regular:new'      {regular, c}          a happy customer decided to come back (c = that customer)
   *   'regular:visit'    {regular, c}          a regular has turned up today and is walking in
   *   'regular:streak'   {regular, c, streak, mult}   served and happy: streak went up (streak/mult are the NEW values)
   *   'regular:broken'   {regular, c, reason, shielded}   reason: 'taste'|'pricey'|'slow'|'wait'|'soldout'|'quit'
   *                                            shielded true = a Streak Shield boost saved it (streak unchanged)
   *   'regular:lost'     {regular}             two bad visits in a row: they stopped coming
   *   'loyalty'          {c, amount, mult}     a regular paid a loyalty bonus on top of the price
   *   -- Dex the Dealer --
   *   'dealer:buy'       {id, kind, cost}      kind 'boost' | 'limited'
   *   'boost:on'         {id}                  a boost became active (bought, or carried into the day)
   * UI -> everyone
   *   'pause'            {paused}
   *   'ui:open' / 'ui:close' {name}
   */

  /* Pause flag (UI owns it, main loop obeys it) ----------------------- */
  SS.paused = false;
  SS.setPaused = function (p) {
    p = !!p;
    if (p === SS.paused) return;
    SS.paused = p;
    SS.emit('pause', { paused: p });
  };

  /** Play a named sound if the audio module is present. UI modules call this for
   *  pure-UI sounds only: click, tick, open, close, error, tally, whoosh.
   *  Sim-driven sounds (coin, pour, bell, ...) are played by audio.js from bus events. */
  SS.sfx = function (name, opts) { if (SS.Audio && SS.Audio.play) { try { SS.Audio.play(name, opts); } catch (e) { /* audio is optional */ } } };

  /** true when animation should be toned down (setting or OS preference) */
  SS.reduced = function () {
    if (SS.state && SS.state.settings && SS.state.settings.reducedMotion) return true;
    return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  };

  /* ------------------------------------------------------------------ *
   * DATA TABLES
   * ids, field names and structure are frozen. Only the sim author may tune
   * the numbers (costs, multipliers, targets).

  var DATA = (SS.DATA = {});

  DATA.price = { min: 0.25, max: 20, step: 0.05, start: 1.0 };
  DATA.startCash = 20;
  DATA.startReputation = 2.0;      // 0..5 stars

  DATA.weather = {
    sunny: { name: 'Sunny', icon: 'sun', traffic: 1.0, thirst: 1.0, temp: [22, 30] },
    heatwave: { name: 'Heat wave', icon: 'heat', traffic: 0.95, thirst: 1.6, temp: [33, 39] },
    cloudy: { name: 'Cloudy', icon: 'cloud', traffic: 0.85, thirst: 0.72, temp: [16, 23] },

  // Who walks by. wtp = willingness-to-pay multiplier, sweet = recipe taste lean (-1 tart .. +1 sweet).
  DATA.kinds = {

    teen: { name: 'Teen', wtp: 0.9, patience: 0.7, speed: 1.05, sweet: 0.4, tip: 0.07, thirst: 1.0 },

    elder: { name: 'Neighbor', wtp: 1.0, patience: 1.5, speed: 0.6, sweet: -0.2, tip: 0.25, thirst: 0.9 },
    tourist: { name: 'Tourist', wtp: 1.5, patience: 0.9, speed: 0.8, sweet: 0.2, tip: 0.3, thirst: 1.1 },
    office: { name: 'Office worker', wtp: 1.7, patience: 0.45, speed: 1.3, sweet: -0.6, tip: 0.2, thirst: 1.0 },
    skater: { name: 'Skater', wtp: 0.85, patience: 0.6, speed: 2.0, sweet: 0.3, tip: 0.05, thirst: 1.2 },
    vip: { name: 'Food critic', wtp: 3.0, patience: 1.2, speed: 0.8, sweet: 0.0, tip: 0.9, thirst: 2.0 }
  };

  DATA.locations = [
    { id: 'street', name: 'Maple Street', blurb: 'Your own front yard. Quiet, friendly and free.',
      rent: 0, unlockCost: 0, repReq: 0, traffic: 1.0, wtp: 1.0,

    { id: 'park', name: 'Meadow Park', blurb: 'Joggers, picnics and a steady stream of families.',
      rent: 6, unlockCost: 60, repReq: 2.2, traffic: 1.5, wtp: 1.15,

    { id: 'beach', name: 'Driftwood Beach', blurb: 'Packed when it is hot. Empty when it rains.',
      rent: 15, unlockCost: 220, repReq: 3.0, traffic: 2.1, wtp: 1.35,

    { id: 'downtown', name: 'Downtown Plaza', blurb: 'Busy people with deep pockets and no time to wait.',
      rent: 32, unlockCost: 600, repReq: 3.6, traffic: 2.8, wtp: 1.7,
      mix: { office: 6, tourist: 2, teen: 1, elder: 1, jogger: 1 } },
    { id: 'carnival', name: 'Starlight Carnival', blurb: 'Lights, music and the longest lines in town.',
      rent: 60, unlockCost: 1500, repReq: 4.2, traffic: 3.8, wtp: 2.1,

  // Upgrade level 0 = not bought ("base" value applies). levels[i] is level i+1.
  DATA.upgrades = [
    { id: 'pitcher', name: 'Pitcher', icon: 'pitcher', desc: 'Holds more cups, so you stop to mix less often.', base: 8,
      levels: [{ cost: 25, value: 12, label: 'Glass jug · 12 cups' }, { cost: 90, value: 18, label: 'Party dispenser · 18 cups' }, { cost: 260, value: 26, label: 'Mega tank · 26 cups' }] },

    { id: 'cooler', name: 'Cooler', icon: 'cooler', desc: 'Stops ice melting in the sun and overnight.', base: 0,

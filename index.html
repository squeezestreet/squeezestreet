<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Squeeze Street</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="preload" href="fonts/BagelFatOne-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div id="game">
  <canvas id="scene" aria-label="Your lemonade stand"></canvas>
  <div id="ui">
    <header id="hud" hidden></header>
    <div id="banner-root" aria-live="polite"></div>
    <section id="sheet" data-mode="dock" hidden></section>
    <div id="daybar" hidden></div>
    <div id="title" hidden></div>
    <button id="legal-link" class="legal-link" type="button">Privacy &amp; Terms</button>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="coach-root"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/mascot.js"></script>
<script src="js/sim.js"></script>
<script src="js/sky.js"></script>
<script src="js/backdrops.js"></script>
<script src="js/actors.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/logo.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Squeeze Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div id="game">
  <canvas id="scene" aria-label="Your lemonade stand"></canvas>
  <div id="ui">
    <header id="hud" hidden></header>
    <div id="banner-root" aria-live="polite"></div>
    <section id="sheet" data-mode="dock" hidden></section>
    <div id="daybar" hidden></div>
    <div id="title" hidden></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="coach-root"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/sim.js"></script>
<script src="js/sky.js"></script>
<script src="js/backdrops.js"></script>
<script src="js/actors.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
